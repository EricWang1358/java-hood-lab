<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHERE 和 HAVING 混用，全表都被扫了一遍？</title>
<script>try{var t=localStorage.getItem("lesson-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* Lesson page. One stage, one teacher line at the bottom: every press brings one sentence and one visible change.
   Colours follow StudyHub's paper tokens (ui/tokens.css). The accent means "look here, now" and nothing else;
   green = came out as it should, plum = did not. No shadows beyond a hairline, no gradients, no decoration. */
:root {
  --canvas: #f1ede6; --surface: #faf8f4; --raised: #ffffff; --sunken: #e8e3da;
  --ink: #1e1a15; --ink-2: #453e35; --muted: #635b51; --faint: #7b7368;
  --rule: #2a1c0e24; --rule-strong: #2a1c0e52;
  --accent: #c03a1f; --accent-text: #ad4025; --accent-ink: #fffaf5; --accent-wash: #c03a1f14;
  --ok: #1c6c48; --ok-wash: #1c6c4817; --bad: #a23461; --bad-wash: #a2346114; --info: #346287; --ochre: #8a5a10;
  --code-k: #8a3b1f;
  --s1: #1c5cab; --s2: #e0703a; --s3: #16a37a; --s4: #8a5a10;
  --font: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  --display: "Segoe UI Variable Display", "SF Pro Display", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Microsoft YaHei UI", monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #161412; --surface: #1e1b18; --raised: #26231f; --sunken: #110f0d;
  --ink: #efe9df; --ink-2: #c5bdb1; --muted: #a59d91; --faint: #958e84;
  --rule: #fff1dc21; --rule-strong: #fff1dc4d;
  --accent: #d8492c; --accent-text: #ec6a4a; --accent-ink: #fff8f2; --accent-wash: #ec6a4a1f;
  --ok: #62c092; --ok-wash: #62c0921f; --bad: #dd8cb9; --bad-wash: #dd8cb91f; --info: #86b4dc; --ochre: #e0a04e;
  --code-k: #eb9a78;
  --s1: #3987e5; --s2: #e0703a; --s3: #199e70; --s4: #7b6a0e;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #161412; --surface: #1e1b18; --raised: #26231f; --sunken: #110f0d;
  --ink: #efe9df; --ink-2: #c5bdb1; --muted: #a59d91; --faint: #958e84;
  --rule: #fff1dc21; --rule-strong: #fff1dc4d;
  --accent: #d8492c; --accent-text: #ec6a4a; --accent-ink: #fff8f2; --accent-wash: #ec6a4a1f;
  --ok: #62c092; --ok-wash: #62c0921f; --bad: #dd8cb9; --bad-wash: #dd8cb91f; --info: #86b4dc; --ochre: #e0a04e;
  --code-k: #eb9a78;
  --s1: #3987e5; --s2: #e0703a; --s3: #199e70; --s4: #7b6a0e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: clamp(16px, .5vw + 10.5px, 19px); -webkit-text-size-adjust: 100%; }
body { margin: 0; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden;
  background: var(--canvas); color: var(--ink); font-family: var(--font); line-height: 1.6; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); }
p code, li code, .opt code, .voice code { font-size: .9em; background: var(--sunken); padding: .08em .36em; border-radius: 5px; }
mark { background: none; color: inherit; box-shadow: inset 0 -.5em 0 var(--accent-wash); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* top: where this lesson is going */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 1rem; padding: .55rem 1.4rem; border-bottom: 1px solid var(--rule); }
.top__title { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top__tools { display: flex; justify-content: flex-end; align-items: center; gap: .8rem; font-size: .8rem; color: var(--muted); }
.beats { display: flex; align-items: center; }
.beat { display: flex; align-items: center; gap: .4rem; padding: .3rem .55rem; border: 0; background: none; border-radius: 8px; font-size: .78rem; color: var(--faint); cursor: pointer; white-space: nowrap; }
.beat::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }
.beat:hover { color: var(--ink); }
.beat.is-done { color: var(--muted); }
.beat.is-done::before { background: currentColor; }
.beat.is-now { color: var(--ink); font-weight: 650; }
.beat.is-now::before { background: var(--accent); border-color: var(--accent); }
.tool { border: 1px solid var(--rule); background: none; border-radius: 8px; padding: .25rem .6rem; cursor: pointer; }
.tool:hover { border-color: var(--rule-strong); color: var(--ink); }

/* stage */
/* no top padding on the scroller itself: a sticky bar inside it must be able to reach the very top */
.stage { overflow-x: hidden; overflow-y: auto; padding: 0 clamp(1rem, 4vw, 3.4rem) 2rem; }
.slide { width: 100%; max-width: 68rem; margin: 0 auto; padding-top: clamp(1.4rem, 4vh, 2.8rem); }
.slide__title { font-family: var(--display); font-size: clamp(1.5rem, 2.6vw, 2.3rem); line-height: 1.22; font-weight: 680; letter-spacing: -.01em; margin: 0 0 1.3rem; text-wrap: balance; }
.slide__blocks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
.slide--split .slide__blocks { grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); column-gap: 2.4rem; align-items: start; }
.slide--split .block:first-child { grid-row: 1 / span 4; }
.block { transition: opacity .28s var(--ease), transform .28s var(--ease); }
.block.is-waiting { opacity: 0; transform: translateY(8px); pointer-events: none; }

.slide--hook .slide__title { font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1.12; font-weight: 720; letter-spacing: -.02em; max-width: 13em; margin-top: clamp(.5rem, 7vh, 4.5rem); margin-bottom: 1.6rem; }
.hook__meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.4rem; margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); max-width: 52rem; }
.hook__meta h3 { font-size: .78rem; font-weight: 600; color: var(--muted); margin: 0 0 .5rem; }
.hook__meta ul { margin: 0; padding: 0; list-style: none; font-size: .92rem; color: var(--ink-2); }
.hook__meta li { padding: .14rem 0; }

.text { font-size: 1.18rem; line-height: 1.65; color: var(--ink-2); margin: 0; max-width: 34em; }
.slide--hook .text { font-size: 1.4rem; color: var(--ink); }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: .7rem; font-size: 1.08rem; line-height: 1.55; }
.points li { display: grid; grid-template-columns: 1.1rem 1fr; }
.points li::before { content: ""; width: 6px; height: 6px; margin-top: .62em; background: var(--ink-2); }
.callout { border-left: 3px solid var(--info); padding: .1rem 0 .1rem 1rem; max-width: 36em; }
.callout--pitfall { border-left-color: var(--bad); }
.callout h4 { margin: 0 0 .2rem; font-size: 1rem; }
.callout p { margin: 0; color: var(--ink-2); }

/* code */
.code { background: var(--raised); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.code__path { padding: .55rem 1rem .5rem; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: .68rem; color: var(--faint); }
.code__scroll { overflow: auto; max-height: min(58vh, 31rem); padding: .5rem 0 .8rem; scrollbar-width: thin; }
.code__line { display: grid; grid-template-columns: 3em minmax(0, 1fr); font-family: var(--mono); font-size: .78rem; line-height: 1.68; white-space: pre; padding-right: 1rem; border-left: 3px solid transparent; transition: opacity .3s, background-color .3s; }
.code__no { text-align: right; padding-right: 1em; color: var(--faint); opacity: .7; user-select: none; }
.code.has-focus .code__line { opacity: .4; }
.code.has-focus .code__line.is-focus { opacity: 1; background: var(--accent-wash); border-left-color: var(--accent); }
.code .code__line.is-changed { opacity: 1; background: var(--ok-wash); border-left-color: var(--ok); }
.tk-k { color: var(--code-k); font-weight: 600; }
.tk-s { color: var(--ok); }
.tk-n { color: var(--info); }
.tk-c { color: var(--faint); font-style: italic; }

/* buttons and segmented choices */
.btn { border: 1px solid var(--rule-strong); background: var(--raised); border-radius: 10px; padding: .5rem 1rem; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn--primary { background: var(--ink); border-color: var(--ink); color: var(--canvas); font-weight: 600; }
.btn--primary:hover { border-color: var(--ink); opacity: .86; }
.btn--quiet { border-color: transparent; background: none; color: var(--muted); padding: .2rem .5rem; font-size: .78rem; }
.btn--quiet:hover { color: var(--ink); border-color: var(--rule); }
.btn:disabled { opacity: .4; cursor: default; }
.seg { display: inline-flex; align-items: center; gap: .6rem; font-size: .82rem; color: var(--muted); }
.seg__set { display: inline-flex; padding: 3px; background: var(--sunken); border-radius: 10px; }
.seg__set button { border: 0; background: none; padding: .32rem .8rem; border-radius: 8px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg__set button:hover { color: var(--ink); }
.seg__set button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--rule), 0 1px 2px #0000001a; }

/* experiment: the code on the left, what really happened on the right */
.exp__bar { display: flex; justify-content: space-between; align-items: center; gap: .8rem 1.5rem; flex-wrap: wrap; margin-bottom: .4rem; padding: .5rem 0; position: sticky; top: 0; z-index: 2; background: var(--canvas); }
.exp__body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 1.6rem; align-items: start; }
.exp .code__scroll { max-height: min(34vh, 22rem); }
.block:has(> .try) { display: none; }
.exp.is-invited .seg__set { animation: invite 2.4s var(--ease); }
@keyframes invite { 0%, 70% { box-shadow: 0 0 0 2px var(--accent); } }
.exp__q { margin: .1rem 0 .7rem; font-size: .92rem; color: var(--ink-2); }
.plot__row { display: grid; grid-template-columns: 7.6em minmax(0, 1fr) 6.2em; align-items: center; gap: .8rem; width: 100%; padding: 0; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
.plot__row[disabled] { cursor: default; }
.plot__label { font-size: .86rem; color: var(--muted); }
.plot__row.is-on .plot__label { color: var(--ink); font-weight: 650; }
.plot__track { position: relative; height: 3.3rem; }
.plot__track::before { content: ""; position: absolute; inset: 50% 0 auto 0; border-top: 1px solid var(--rule); }
.plot__track::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--expect); border-left: 1.5px dashed var(--ok); opacity: .7; }
.dot { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--bad); z-index: 1;
  transition: left .55s var(--ease), transform .55s var(--ease), opacity .3s, background-color .3s; }
.dot.is-ok { background: var(--ok); }
.dot.is-waiting { opacity: 0; pointer-events: none; }
.plot__row:not(.is-on) .dot { opacity: .5; }
.plot__row:not(.is-on) .dot.is-waiting { opacity: 0; }
.plot__sum { text-align: right; font-size: .8rem; color: var(--muted); line-height: 1.35; }
.plot__sum b { display: block; font-size: .9rem; color: var(--bad); }
.plot__sum b.is-ok { color: var(--ok); }
.plot__axis { display: grid; grid-template-columns: 7.6em minmax(0, 1fr) 6.2em; gap: .8rem; border-top: 1px solid var(--rule); font-size: .72rem; color: var(--faint); }
.plot__ticks { position: relative; height: 1.6rem; }
.plot__ticks span { position: absolute; top: .3rem; white-space: nowrap; }
.plot__ticks .is-expect { left: var(--expect); transform: translateX(-100%); padding-right: .4rem; color: var(--ok); font-weight: 600; }
.exp__finding { margin: .9rem 0 0; font-size: 1.04rem; line-height: 1.55; min-height: 3.2em; }
.exp__finding b { font-variant-numeric: tabular-nums; }
.exp__foot { margin-top: .5rem; display: flex; align-items: center; gap: .3rem .9rem; flex-wrap: wrap; font-size: .72rem; color: var(--faint); }
.cmd { font-family: var(--mono); background: var(--sunken); color: var(--ink-2); padding: .15rem .5rem; border-radius: 6px; }

/* lanes: two threads and the one thing they share; time runs downward */
.lanes__expr { display: flex; align-items: center; gap: .6rem 1.4rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.lanes__code { font-family: var(--mono); font-size: 1.5rem; font-weight: 650; }
.lanes__parts { display: flex; align-items: center; gap: .45rem; font-size: .84rem; color: var(--faint); }
.part { padding: .2rem .7rem; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); transition: color .25s, border-color .25s, background-color .25s; }
.part.is-now { color: var(--accent-text); border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.lanes__grid { display: grid; grid-template-columns: minmax(0, 1fr) 5.4rem minmax(0, 1fr); max-width: 46rem; margin: 0; }
.lanes__head { font-size: .82rem; color: var(--muted); padding-bottom: .5rem; border-bottom: 1px solid var(--rule); }
.lanes__head--a { text-align: right; padding-right: 3.6rem; }
.lanes__head--b { padding-left: 3.6rem; }
.lanes__head--mid { text-align: center; font-family: var(--mono); color: var(--ink); font-weight: 600; }
.lcell { min-height: 2.9rem; display: flex; align-items: center; transition: opacity .3s var(--ease); }
.lcell--a { justify-content: flex-end; }
.lcell--mid { justify-content: center; position: relative; }
.lcell--mid::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px solid var(--rule-strong); }
.lrow { display: contents; }
.lrow.is-waiting .lcell > * { opacity: 0; }
.lcell > * { transition: opacity .3s var(--ease); }
.chip { font-size: .92rem; padding: .32rem .8rem; border-radius: 8px; background: var(--raised); border: 1px solid var(--rule); white-space: nowrap; }
.lrow.is-now .chip { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.arrow { flex: 0 0 3rem; height: 0; border-top: 1.5px solid var(--ink-2); position: relative; margin: 0 .3rem; }
.arrow::after { content: ""; position: absolute; top: -5px; border: 4.25px solid transparent; }
.arrow--right::after { right: -2px; border-left: 7px solid var(--ink-2); border-right: 0; }
.arrow--left::after { left: -2px; border-right: 7px solid var(--ink-2); border-left: 0; }
.arrow--none { border-top-color: transparent; }
.arrow--none::after { display: none; }
.val { position: relative; z-index: 1; min-width: 2.7rem; text-align: center; font-family: var(--mono); font-size: .98rem; font-weight: 650; padding: .2rem .6rem; border-radius: 8px; background: var(--canvas); border: 1.5px solid var(--ink-2); }
.val--write { border-color: var(--accent); color: var(--accent-text); }
.lanes__verdict { max-width: 46rem; margin: .9rem 0 0; padding-top: .9rem; border-top: 1px solid var(--rule); font-size: 1.15rem; font-weight: 650; transition: opacity .3s; }
.lanes__verdict.is-waiting { opacity: 0; }

/* guess, then see */
.predict__q, .quiz__q { font-size: 1.3rem; font-weight: 650; line-height: 1.4; margin: 0 0 1rem; }
.opts { display: grid; gap: .55rem; max-width: 40rem; }
.opt { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; align-items: center; gap: .6rem; width: 100%; text-align: left; padding: .75rem 1rem; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--raised); cursor: pointer; font-size: 1.02rem; }
.opt:hover { border-color: var(--ink-2); }
.opt__key { font-family: var(--mono); font-size: .82rem; color: var(--faint); }
.opt__tag { font-size: .74rem; font-weight: 600; }
.opt.is-picked { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.opt.is-picked .opt__tag { color: var(--ink-2); }
.opt.is-right { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.opt.is-right .opt__tag { color: var(--ok); }
.opt.is-wrong { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.opt.is-wrong .opt__tag { color: var(--bad); }
.opt__why { grid-column: 2 / -1; font-size: .88rem; color: var(--ink-2); }
.reveal { display: flex; gap: .5rem 2.6rem; flex-wrap: wrap; padding-top: .8rem; border-top: 1px solid var(--rule); max-width: 46rem; }
.reveal dl { margin: 0; }
.reveal dt { font-size: .76rem; color: var(--muted); }
.reveal dd { margin: .1rem 0 0; font-size: 1.02rem; font-weight: 600; }
.reveal .is-ok { color: var(--ok); }
.reveal .is-miss { color: var(--bad); }

/* the name comes last */
.name__term { font-family: var(--display); font-size: clamp(2.4rem, 5.4vw, 4.2rem); line-height: 1.1; font-weight: 720; letter-spacing: -.02em; margin: 0; }
.name__alias { font-family: var(--mono); font-size: .92rem; color: var(--muted); margin: .5rem 0 0; }
.name__line { font-size: 1.28rem; line-height: 1.55; margin: 1.1rem 0 0; max-width: 30em; }
.name__asked { margin: 1.8rem 0 0; padding-top: 1rem; border-top: 1px solid var(--rule); max-width: 40rem; }
.name__asked h4 { font-size: .78rem; font-weight: 600; color: var(--muted); margin: 0 0 .4rem; }
.name__asked ul { margin: 0; padding: 0; list-style: none; font-size: 1.02rem; color: var(--ink-2); }
.name__asked li { padding: .2rem 0; }

/* say it aloud, take three cards */
.say__prompt { font-size: 1.5rem; font-weight: 650; line-height: 1.4; margin: 0 0 1.2rem; max-width: 26em; text-wrap: balance; }
.say__row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.say__clock { font-family: var(--mono); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 3.4em; }
.say__points { margin: 1.4rem 0 0; padding: 1rem 0 0; border-top: 1px solid var(--rule); list-style: none; display: grid; gap: .5rem; max-width: 40rem; }
.say__points label { display: grid; grid-template-columns: 1.4rem 1fr; gap: .5rem; align-items: start; cursor: pointer; font-size: 1.02rem; }
.say__points input { width: 1.05rem; height: 1.05rem; margin-top: .32rem; accent-color: var(--ok); }
.say__score { margin: .8rem 0 0; font-size: .92rem; color: var(--muted); }
.cards { display: grid; gap: 0; max-width: 44rem; border-bottom: 1px solid var(--rule); }
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; align-items: baseline; padding: .9rem 0; border-top: 1px solid var(--rule); }
.card__q { font-size: 1.1rem; font-weight: 600; margin: 0; }
.card__a { grid-column: 1 / -1; margin: 0; color: var(--ink-2); }

/* the teacher: what a person standing next to you would say right now. It leads; the stage shows. */
.voice { border-top: 1px solid var(--rule); padding: 1rem clamp(1rem, 4vw, 3.4rem) 1.1rem; }
.voice__inner { max-width: 68rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.6rem; align-items: end; }
.voice__line { margin: 0; font-size: 1.2rem; line-height: 1.62; min-height: 4.86em; max-width: 43em; }
.voice__line > span { display: block; }
.voice__line.is-fresh > span { animation: line-in .32s var(--ease); }
.voice__nav { display: flex; gap: .5rem; }
@keyframes line-in { from { opacity: 0; transform: translateY(5px); } }

.voice__key { margin: .4rem 0 0; font-size: .8rem; color: var(--muted); animation: line-in .32s var(--ease); }
.tool.is-flash { animation: flash 1.2s var(--ease); }
@keyframes flash { 0%, 40% { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); } }

/* reminders at the moment of need */
.term { border-bottom: 1.5px dotted var(--ochre); cursor: help; border-radius: 2px; }
.term:hover, .term:focus-visible { background: var(--accent-wash); }
.tip { position: fixed; z-index: 20; max-width: 22rem; padding: .6rem .8rem; border-radius: 10px; background: var(--ink); color: var(--canvas); font-size: .86rem; line-height: 1.5; box-shadow: 0 8px 24px -10px #000000a0; }
.tip b { display: block; font-size: .8rem; opacity: .75; margin-bottom: .1rem; }
.tip code { background: none; padding: 0; }
.notes { position: relative; }
.notes__list { position: absolute; right: 0; top: calc(100% + .5rem); z-index: 15; width: min(22rem, 86vw); margin: 0; padding: .7rem 1rem .7rem 2rem; background: var(--raised); border: 1px solid var(--rule-strong); border-radius: 12px; font-size: .88rem; color: var(--ink); line-height: 1.5; box-shadow: 0 14px 34px -20px #000000a0; }
.notes__list li { padding: .15rem 0; }
.notes__list .is-empty { list-style: none; margin-left: -1rem; color: var(--muted); }

.exp__note { margin: .5rem 0 0; font-size: .84rem; color: var(--muted); min-height: 1.4em; }
button.plot__label { border: 0; background: none; padding: .3rem 0; text-align: left; cursor: pointer; line-height: 1.3; }
button.plot__label:hover { color: var(--ink); }
.plot__row { cursor: default; }
.dot { cursor: pointer; }
.dot::after { content: ""; position: absolute; inset: -5px; }
.dot:hover { box-shadow: 0 0 0 3px var(--canvas), 0 0 0 4.5px currentColor; color: var(--ink-2); }
.exp__probe { color: var(--ink-2); font-variant-numeric: tabular-nums; }

.lrow-list { display: contents; }
.lrow--controls .lcell { padding-top: .7rem; }
.lrow--controls .lcell--a { padding-right: .8rem; }
.lrow--controls .lcell--b { padding-left: .8rem; }
.sched__bar { display: flex; align-items: center; justify-content: flex-start; gap: .6rem 1.2rem; flex-wrap: wrap; margin-bottom: 1rem; }
.goals { display: flex; gap: .5rem; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; font-size: .86rem; }
.goal { display: flex; align-items: center; gap: .4rem; padding: .22rem .7rem; border: 1px solid var(--rule-strong); border-radius: 999px; color: var(--ink-2); }
.goal::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; }
.goal.is-done { color: var(--ok); border-color: var(--ok); font-weight: 600; }
.goal.is-done::before { background: var(--ok); border-color: var(--ok); }
.sched__result { max-width: 46rem; margin: .9rem 0 0; min-height: 3.2em; font-size: 1.05rem; }

.block > .code { max-width: 46rem; }
.lrow--controls .btn { border-color: var(--ink-2); font-weight: 600; }
.lrow--controls .btn:disabled { border-color: var(--rule-strong); font-weight: 400; }

/* small answer buttons, shared by the warm-up, the lanes question and the cases */
.picks { display: flex; gap: .45rem; flex-wrap: wrap; }
.pick { border: 1px solid var(--rule-strong); background: var(--raised); border-radius: 9px; padding: .36rem .85rem; font-size: .95rem; cursor: pointer; }
.pick:hover:not(:disabled) { border-color: var(--ink-2); }
.pick:disabled { cursor: default; color: var(--muted); }
.pick.is-right { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); color: var(--ok); font-weight: 600; }
.pick.is-wrong { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); color: var(--bad); }
.pick--tool { font-family: var(--mono); font-size: .86rem; }

/* opening: what you already have, then a picture to hang the lesson on */
.recall, .cases { max-width: 50rem; }
.recall__item { display: grid; grid-template-columns: 7.4rem minmax(0, 1fr); gap: .4rem 1.2rem; padding: .9rem 0; border-top: 1px solid var(--rule); }
.recall__have { grid-row: 1 / span 3; font-size: .82rem; color: var(--muted); padding-top: .2rem; }
.recall__q, .cases__text { margin: 0; font-size: 1.08rem; font-weight: 600; line-height: 1.5; }
.recall__why, .cases__why { margin: 0; font-size: .92rem; color: var(--ink-2); }
.recall__score, .cases__score { margin: 0; padding-top: .8rem; border-top: 1px solid var(--rule); font-size: .92rem; color: var(--muted); min-height: 2.4em; }
.cases__item { display: grid; gap: .5rem; padding: .9rem 0; border-top: 1px solid var(--rule); }
.cases__text { font-weight: 400; }
.scene__story { margin: 0 0 1.4rem; font-size: 1.28rem; line-height: 1.7; max-width: 33em; }
.scene__map { max-width: 44rem; transition: opacity .3s var(--ease); }
.scene__map.is-waiting, .scene__row.is-waiting { opacity: 0; }
.scene__head, .scene__row { display: grid; grid-template-columns: minmax(0, 1fr) 2.6rem minmax(0, 1.1fr); align-items: center; }
.scene__head { font-size: .76rem; color: var(--muted); padding-bottom: .4rem; border-bottom: 1px solid var(--rule); }
.scene__row { padding: .58rem 0; border-bottom: 1px solid var(--rule); font-size: 1.04rem; transition: opacity .3s var(--ease); }
.scene__arrow { color: var(--faint); }
.scene__row.is-now .scene__arrow { color: var(--accent); }
.scene__to { font-weight: 600; }

/* find the line; look inside */
.inside { max-width: 46rem; }
.spot { display: grid; grid-template-columns: minmax(0, 46rem) minmax(13rem, 19rem); gap: 0 2rem; align-items: start; }
.spot__q { grid-column: 1 / -1; }
.spot__how { margin: .2rem 0 .8rem; font-size: .92rem; color: var(--muted); }
.spot__q { margin: 0 0 .8rem; font-size: 1.18rem; font-weight: 650; line-height: 1.45; }
.spot .code__scroll { max-height: max(12rem, calc(100vh - 21.5rem)); }
.code.is-pickable .code__line { cursor: pointer; }
.code.is-pickable .code__line:hover { background: var(--sunken); }
.code__line.is-wrong { background: var(--bad-wash); border-left-color: var(--bad); }
.spot__out { margin: 0; font-size: 1rem; line-height: 1.7; color: var(--ink-2); }
.spot__out.is-ok { color: var(--ok); font-weight: 600; }
.inside__what { margin: 0 0 .6rem; font-size: .86rem; color: var(--muted); }
.inside .code__line { position: relative; font-size: .88rem; line-height: 2.2; }
.code__tag { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); font-family: var(--font); font-size: .78rem; font-weight: 600; line-height: 1.7; padding: 0 .7rem; border-radius: 999px; background: var(--raised); border: 1px solid var(--rule-strong); }
.code__line.is-focus .code__tag { border-color: var(--accent); color: var(--accent-text); }

/* lanes: a question between two steps; steps that touch nothing */
.lanes--long .lcell { min-height: 2.5rem; }
.chip--wait { border-style: dashed; color: var(--muted); }
.chip--fail { border-color: var(--bad); color: var(--bad); background: var(--bad-wash); }
.chip--ok { border-color: var(--ok); color: var(--ok); }
.lanes__ask { max-width: 46rem; margin-top: .8rem; padding: .8rem 1rem; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--surface); display: grid; gap: .5rem; }
.lanes__ask[hidden] { display: none; }
.lanes__ask p { margin: 0; font-weight: 600; }
.lanes__ask .ask__out { font-weight: 400; font-size: .9rem; color: var(--muted); min-height: 1.5em; }

/* runs let out by hand; a reference answer after speaking */
.exp__hand { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .9rem; }
.exp__hand[hidden] { display: none; }
.plot__sum.is-held > * { visibility: hidden; }
.say__model { margin: 1rem 0 0; padding: .9rem 1.1rem; border-left: 3px solid var(--rule-strong); background: var(--surface); font-size: 1rem; line-height: 1.8; max-width: 42rem; }

/* how to choose between the tools just met */
.choose { max-width: 62rem; }
.choose__head, .choose__row { display: grid; grid-template-columns: 9.6rem repeat(3, minmax(0, 1fr)); gap: 0 1.6rem; }
.choose__head { font-size: .76rem; color: var(--muted); padding-bottom: .4rem; }
.choose__row { padding: .8rem 0; border-top: 1px solid var(--rule); font-size: .98rem; line-height: 1.5; color: var(--ink-2); }
.choose__row { transition: opacity .3s var(--ease); }
.choose.is-walking .choose__row:not(.is-now) { opacity: .42; }
.choose__name { font-family: var(--mono); font-weight: 650; color: var(--ink); }
.choose__rule.is-waiting { visibility: hidden; }
.choose__rule { margin: 0; padding-top: .9rem; border-top: 1px solid var(--rule-strong); font-size: 1.12rem; font-weight: 600; }

/* pictures: two actors and the thing they share. Drawn at a fixed size so every part has a known place. */
.pic { position: relative; width: 300px; height: 300px; flex: none; font-size: 16px; line-height: 1.3; }
.pic__lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pic__arrow { opacity: 0; transition: opacity .25s var(--ease); }
.pic__arrow.is-on { opacity: 1; }
.pic__arrow line { stroke: var(--accent); stroke-width: 1.75; }
.pic__arrow polygon { fill: var(--accent); }
.pic--plain .pic__arrow line { stroke: var(--ink-2); }
.pic--plain .pic__arrow polygon { fill: var(--ink-2); }
.pic__over { position: absolute; left: 0; right: 0; bottom: calc(100% - 38px); display: grid; justify-items: center; gap: 3px; }
.pic__name { font-size: 13px; color: var(--muted); }
.pic__tags { display: grid; justify-items: center; gap: 3px; }
.pic__tags span { font-family: var(--mono); font-size: 12.5px; font-weight: 650; color: var(--ink); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--surface); white-space: nowrap; }
.pic__board { position: absolute; left: 90px; top: 44px; width: 120px; height: 62px; display: grid; place-items: center; border: 1.5px solid var(--ink-2); border-radius: 8px; background: var(--raised); transition: border-color .25s, box-shadow .25s; }
.pic__board.is-now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pic__value { font-family: var(--mono); font-size: 28px; font-weight: 650; line-height: 1; }
.pic__board.is-now .pic__value { color: var(--accent-text); }
.pic__hand { position: absolute; top: 146px; width: 64px; height: 38px; display: grid; place-items: center; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--raised); font-family: var(--mono); font-size: 16px; transition: border-color .25s, box-shadow .25s; }
.pic__hand--a { left: 50px; }
.pic__hand--b { left: 186px; }
.pic__hand small { position: absolute; left: 0; right: 0; top: -18px; text-align: center; font-family: var(--font); font-size: 11px; color: var(--faint); }
.pic__hand.is-empty { border-style: dashed; background: none; }
.pic__hand.is-now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pic__actor { position: absolute; top: 196px; width: 110px; display: grid; justify-items: center; gap: 3px; }
.pic__actor--a { left: 0; }
.pic__actor--b { left: 190px; }
.pic__figure { width: 44px; height: 40px; fill: var(--raised); stroke: var(--ink-2); stroke-width: 1.5; transition: stroke .25s; }
.pic__actor.is-now .pic__figure { stroke: var(--accent); }
.pic__note { font-size: 12.5px; padding: 2px 8px; border-radius: 7px; border: 1px solid var(--rule-strong); background: var(--raised); white-space: nowrap; }
.pic__note:empty { display: none; }
.pic__note--wait { border-style: dashed; color: var(--muted); }
.pic__note--fail { border-color: var(--bad); color: var(--bad); background: var(--bad-wash); }
.pic__note--ok { border-color: var(--ok); color: var(--ok); }
.pic__note.is-now { box-shadow: 0 0 0 1px currentColor; }
.pic__action { position: absolute; left: 0; right: 0; top: 138px; text-align: center; font-family: var(--mono); font-weight: 650; font-size: 14px; color: var(--ink); }
.pic__action.is-now { color: var(--accent-text); }
.pic__action:empty { display: none; }
.scene__body.has-picture { display: grid; grid-template-columns: minmax(0, 44rem) 300px; gap: 0 2.4rem; align-items: start; }
.lanes { display: grid; grid-template-columns: minmax(0, 46rem) 300px; gap: 0 2rem; align-items: start; }
.lanes__side { position: sticky; top: .6rem; }
.lanes__now { margin: 0 0 .1rem; font-size: .76rem; color: var(--muted); text-align: center; }
@media (max-width: 1220px) { .lanes { grid-template-columns: minmax(0, 1fr); } .lanes__side { display: none; } }

/* chart: the recorded runs as lines. Colour names the way of writing; a hollow point means that group came out wrong. */
.chart { margin: 0; display: grid; grid-template-columns: minmax(0, 44rem) minmax(13rem, 1fr); gap: 0 2rem; align-items: start; }
.chart__cap { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1rem; font-size: .84rem; color: var(--muted); margin-bottom: .5rem; }
.chart__cap b { font-size: 1rem; color: var(--ink); }
.chart__marks { display: inline-flex; align-items: center; gap: .4rem; }
.chart__mark { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--ink-2); border: 2px solid var(--ink-2); }
.chart__mark.is-wrong { background: transparent; margin-left: .7rem; }
.chart__picks { display: grid; justify-items: start; gap: .4rem; margin-bottom: 1rem; }
.chart__pick { display: inline-flex; align-items: center; gap: .5rem; padding: .26rem .75rem; border: 1px solid var(--rule-strong); border-radius: 999px; background: none; font-size: .86rem; color: var(--ink-2); cursor: pointer; }
.chart__pick:hover { border-color: var(--ink-2); }
.chart__pick[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; background: var(--raised); }
.chart__key { flex: none; width: 18px; height: 0; border-top: 3px solid var(--s, var(--ink-2)); border-radius: 2px; }
.chart__key--1, .chart__series--1 { --s: var(--s1); }
.chart__key--2, .chart__series--2 { --s: var(--s2); }
.chart__key--3, .chart__series--3 { --s: var(--s3); }
.chart__key--4, .chart__series--4 { --s: var(--s4); }
.chart__plot { position: relative; }
.chart__svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart__grid { stroke: var(--rule); stroke-width: 1; }
.chart__base { stroke: var(--rule-strong); stroke-width: 1; }
.chart__tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart__series { transition: opacity .25s var(--ease); }
.chart__series.is-dim { opacity: .2; }
.chart__line { fill: none; stroke: var(--s, var(--ink-2)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; transition: stroke-width .2s; }
.chart__series.is-on .chart__line { stroke-width: 3.2; }
.chart__lead { fill: none; stroke: var(--s, var(--ink-2)); stroke-width: 1; opacity: .55; }
.chart__dot { fill: var(--s, var(--ink-2)); stroke: var(--canvas); stroke-width: 2; }
.chart__dot.is-wrong { fill: var(--canvas); stroke: var(--s, var(--ink-2)); }
.chart__name { font-size: 11.5px; fill: var(--ink-2); }
.chart__end { font-weight: 650; fill: var(--ink); font-variant-numeric: tabular-nums; }
.chart__cross { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
.chart__cross.is-on { opacity: .7; }
.chart__hit { fill: transparent; cursor: crosshair; outline: none; }
.chart__hit:focus-visible { stroke: var(--ink-2); stroke-dasharray: 2 3; }
.chart__tip { position: absolute; top: 4%; z-index: 2; min-width: 16rem; padding: .55rem .7rem; border-radius: 10px; background: var(--raised); border: 1px solid var(--rule-strong); box-shadow: 0 8px 22px -14px #000000a0; font-size: .8rem; display: grid; gap: .25rem; pointer-events: none; }
.chart__tip[hidden] { display: none; }
.chart__row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 4.8em; gap: .5rem; align-items: center; }
.chart__row.is-dim { opacity: .45; }
.chart__row span:last-child { color: var(--muted); text-align: right; }
.chart__row span.is-wrong { color: var(--bad); }
.chart__read { margin: 0 0 .8rem; min-height: 6.4em; font-size: .98rem; line-height: 1.65; color: var(--ink-2); }
.chart__table { font-size: .8rem; color: var(--muted); }
.chart__table summary { cursor: pointer; width: max-content; }
.chart__table table { border-collapse: collapse; margin-top: .4rem; font-variant-numeric: tabular-nums; }
.chart__table th, .chart__table td { padding: .22rem .5rem; border-bottom: 1px solid var(--rule); text-align: right; font-weight: 400; white-space: nowrap; }
.chart__table th:first-child { text-align: left; }

/* decide: the rule for choosing, as a small tree */
.decide { max-width: 19rem; padding: 1rem 1.1rem; border: 1px solid var(--rule-strong); border-radius: 12px; background: var(--surface); }
.decide__q { margin: 0; font-weight: 650; font-size: 1.02rem; }
.decide__list { list-style: none; margin: 0; padding: .5rem 0 0 .5rem; }
.decide__branch { position: relative; display: grid; gap: .2rem; padding: .5rem 0 .6rem 1.4rem; border-left: 1.5px solid var(--ink-2); }
.decide__branch:last-child { border-left-color: transparent; }
.decide__branch::before { content: ""; position: absolute; left: -1.5px; top: 0; width: 1rem; height: 1.2rem; border-left: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); border-bottom-left-radius: 9px; }
.decide__when { font-size: .92rem; color: var(--ink-2); }
.decide__pick { justify-self: start; font-family: var(--mono); font-weight: 650; font-size: .92rem; padding: .18rem .6rem; border: 1.5px solid var(--ink-2); border-radius: 8px; background: var(--raised); transition: border-color .3s, color .3s; }
.decide__eg { font-size: .78rem; color: var(--muted); }
.decide__branch.is-used .decide__pick { border-color: var(--ok); color: var(--ok); }
.decide__branch.is-hit .decide__pick { animation: hit 1.6s var(--ease); }
@keyframes hit { 0%, 55% { box-shadow: 0 0 0 5px var(--ok-wash), 0 0 0 1.5px var(--ok); } 100% { box-shadow: 0 0 0 0 transparent; } }
.slide--split .slide__blocks:has(.decide) { grid-template-columns: minmax(0, 1fr) 19rem; }
.slide--split .block:has(> .decide) { grid-column: 2; position: sticky; top: .6rem; }
.slide--split .block:has(> .decide) ~ .block { grid-column: 1; grid-row: 1; }

@media (max-width: 860px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; padding: .5rem .9rem; }
  .top__title, #count { display: none; }
  .beat:not(.is-now) { font-size: 0; gap: 0; padding: .3rem .22rem; }
  .stage { padding: 0 .9rem 1.4rem; }
  .slide { padding-top: 1rem; }
  .exp__bar { position: static; }
  .slide--split .slide__blocks, .exp__body, .hook__meta { grid-template-columns: minmax(0, 1fr); }
  .hook__meta { gap: 1.2rem; }
  .slide--split .block:first-child { grid-row: auto; }
  .code__scroll, .exp .code__scroll { max-height: 15rem; }
  .seg, .seg__set { flex-wrap: wrap; }
  .plot__label { font-size: .72rem; overflow-wrap: anywhere; }
  .plot__sum { font-size: .72rem; }
  .plot__sum b { font-size: .8rem; }
  .lrow--controls .btn { padding: .45rem .5rem; font-size: .8rem; }
  .lrow--controls .lcell--a { padding-right: .3rem; } .lrow--controls .lcell--b { padding-left: .3rem; }
  .plot__row, .plot__axis { grid-template-columns: 5.8em minmax(0, 1fr) 4.4em; gap: .4rem; }
  .lanes__grid { grid-template-columns: minmax(0, 1fr) 3.4rem minmax(0, 1fr); }
  .lanes__head--a { padding-right: 1.4rem; } .lanes__head--b { padding-left: 1.4rem; }
  .arrow { flex-basis: 1rem; margin: 0 .15rem; }
  .chip { font-size: .78rem; padding: .28rem .45rem; }
  .val { min-width: 2.2rem; padding: .2rem .3rem; font-size: .88rem; }
  .voice { padding: .7rem .9rem .8rem; }
  .voice__inner { gap: .7rem; }
  .voice__line { font-size: 1rem; line-height: 1.55; min-height: 0; }
  .exp__body > :first-child { order: 2; }
  .choose__head { display: none; }
  .recall__item { grid-template-columns: minmax(0, 1fr); }
  .spot { grid-template-columns: minmax(0, 1fr); }
  .spot .code__scroll { max-height: 46vh; }
  .spot__side { margin-top: .7rem; }
  .spot__how { display: none; }
  .recall__have { grid-row: auto; }
  .scene__body.has-picture, .chart { grid-template-columns: minmax(0, 1fr); }
  .scene__body .pic { order: -1; justify-self: center; margin-bottom: .6rem; }
  .chart__picks { display: flex; flex-wrap: wrap; margin: .6rem 0; }
  .chart__pick { font-size: .8rem; padding: .22rem .6rem; }
  .chart__tick, .chart__name { font-size: 19px; }
  .chart__label { display: none; }
  .chart__dot { r: 7px; }
  .chart__line { stroke-width: 3; }
  .scene__head, .scene__row { column-gap: .4rem; }
  .chart__read { min-height: 0; }
  .chart__tip { min-width: 13rem; }
  .slide--split .slide__blocks:has(.decide) { grid-template-columns: minmax(0, 1fr); }
  .slide--split .block:has(> .decide), .slide--split .block:has(> .decide) ~ .block { grid-column: auto; grid-row: auto; position: static; }
  .decide { max-width: none; }
  .code__tag { position: static; transform: none; grid-column: 2; justify-self: start; margin-bottom: .3rem; }
  .choose__row { grid-template-columns: minmax(0, 1fr); gap: .2rem; }
  .choose__row > [data-label]::before { content: attr(data-label) "："; color: var(--muted); font-size: .82em; }
  .voice__nav .btn { padding: .5rem .7rem; }
  .btn__label { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
@media print { body { height: auto; overflow: visible; display: block; } .voice__nav, .top__tools { display: none; } }

</style>
</head>
<body>
<header class="top">
  <div class="top__title" id="title"></div>
  <nav class="beats" id="beats" aria-label="这节课走到哪了"></nav>
  <div class="top__tools">
    <span class="num" id="count"></span>
    <div class="notes"><button class="tool" id="notes" type="button">要点 0</button><ul class="notes__list" id="notes-list" hidden></ul></div>
    <button class="tool" id="theme" type="button">深色</button>
  </div>
</header>
<main class="stage" id="stage"></main>
<footer class="voice" aria-label="老师的讲解">
  <div class="voice__inner">
    <div><p class="voice__line" id="line" aria-live="polite"></p><p class="voice__key" id="key" hidden></p></div>
    <div class="voice__nav">
      <button class="btn" id="prev" type="button" aria-label="上一步">←</button>
      <button class="btn btn--primary" id="next" type="button"><span class="btn__label">下一步 </span>→</button>
    </div>

<script type="application/json" id="lesson-data">{"format":"studyhub-lesson/1","template":"experiment","id":"sql-group-having","course":"MySQL 索引、事务与锁","title":"WHERE 和 HAVING 混用，全表都被扫了一遍？","lead":"能用 WHERE 先过滤 90% 无关行，却放到 HAVING 里等 GROUP BY 分完组再丢掉，索引失效不说还白建巨大哈希表。","minutes":40,"needs":["写过包含 GROUP BY 的聚合 SQL"],"after":["背出 SQL 逻辑执行顺序（FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY）","分清 WHERE（分组前行级过滤）与 HAVING（分组后聚合过滤）的职责边界","掌握用 (WHERE等值列, GROUP BY列) 联合索引实现流式分组、消除 Using temporary"],"terms":{"WHERE":"行级过滤子句，在 GROUP BY 之前执行，可以利用索引缩减扫描行数，不能包含聚合函数。","HAVING":"组级过滤子句，在 GROUP BY 聚合之后执行，用于对 COUNT/SUM 等聚合结果做二次筛选。","流式分组":"当 GROUP BY 列在 WHERE 等值条件后刚好有序（命中联合索引前缀），引擎无需建临时表即可顺序累加计数。","Using temporary":"EXPLAIN Extra 中的警告，表示 MySQL 为完成分组或去重创建了内部临时表（数据量大时会落盘变慢）。"},"experiments":{"wherehaving":{"runner":"java","home":"lab.wherehaving","variants":[{"id":"HavingFilter","label":"用 HAVING 过滤状态","note":"先把 30 万行全塞进 GROUP BY 哈希表，最后再用 HAVING 扔掉 90%。"},{"id":"WhereBeforeGroup","label":"WHERE 先过滤再分组","note":"先用 WHERE 筛出 10% 的 PAID 行，再送进 GROUP BY。"},{"id":"IndexedWhere","label":"联合索引流式分组","note":"建 (status, user_id) 索引，直接定位 status=PAID 且按 user_id 有序流式计数。"},{"id":"WherePlusHaving","label":"WHERE+HAVING 各司其职","note":"WHERE 滤行状态，HAVING 滤聚合结果（如 COUNT(*) >= 3）。"}],"knob":{"label":"总订单行数","values":["50000","100000","300000","600000"],"default":"300000"},"repeat":10,"metric":{"key":"groupedRows","expectKey":"expected","label":"送进 GROUP BY 的行数"},"time":{"key":"ms","label":"耗时","unit":"ms"},"lang":"java","sources":{"HavingFilter":"package lab.wherehaving;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class HavingFilter {\n    public static void main(String[] args) {\n        int rows = Integer.parseInt(args[0]);\n        int[] userIds = new int[rows];\n        int[] status = new int[rows]; // 1 = PAID (10%), 0 = OTHER (90%)\n        for (int i = 0; i \u003c rows; i++) {\n            userIds[i] = i % 5000;\n            status[i] = (i % 10 == 0) ? 1 : 0;\n        }\n\n        long start = System.nanoTime();\n        // GROUP BY (user_id, status) first, then HAVING status = 1\n        Map\u003cLong, Integer> groupMap = new HashMap\u003c>();\n        int groupedRows = 0;\n        for (int i = 0; i \u003c rows; i++) {\n            groupedRows++;\n            long key = ((long) userIds[i] \u003c\u003c 1) | status[i];\n            groupMap.merge(key, 1, Integer::sum);\n        }\n        int keptGroups = 0;\n        for (long key : groupMap.keySet()) {\n            if ((key & 1L) == 1L) keptGroups++;\n        }\n\n        long ms = (System.nanoTime() - start) / 1_000_000;\n        System.out.println(\"groupedRows=\" + groupedRows);\n        System.out.println(\"expected=\" + (rows / 10));\n        System.out.println(\"keptGroups=\" + keptGroups);\n        System.out.println(\"ms=\" + ms);\n    }\n}\n","WhereBeforeGroup":"package lab.wherehaving;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class WhereBeforeGroup {\n    public static void main(String[] args) {\n        int rows = Integer.parseInt(args[0]);\n        int[] userIds = new int[rows];\n        int[] status = new int[rows];\n        for (int i = 0; i \u003c rows; i++) {\n            userIds[i] = i % 5000;\n            status[i] = (i % 10 == 0) ? 1 : 0;\n        }\n\n        long start = System.nanoTime();\n        // WHERE status = 1 filters out 90% BEFORE GROUP BY\n        Map\u003cInteger, Integer> groupMap = new HashMap\u003c>();\n        int groupedRows = 0;\n        for (int i = 0; i \u003c rows; i++) {\n            if (status[i] != 1) continue;\n            groupedRows++;\n            groupMap.merge(userIds[i], 1, Integer::sum);\n        }\n\n        long ms = (System.nanoTime() - start) / 1_000_000;\n        System.out.println(\"groupedRows=\" + groupedRows);\n        System.out.println(\"expected=\" + (rows / 10));\n        System.out.println(\"keptGroups=\" + groupMap.size());\n        System.out.println(\"ms=\" + ms);\n    }\n}\n","IndexedWhere":"package lab.wherehaving;\n\npublic class IndexedWhere {\n    public static void main(String[] args) {\n        int rows = Integer.parseInt(args[0]);\n        int paidCount = rows / 10;\n        int[] paidUserIdsSorted = new int[paidCount];\n        for (int i = 0; i \u003c paidCount; i++) {\n            paidUserIdsSorted[i] = i / Math.max(1, paidCount / 5000);\n        }\n\n        long start = System.nanoTime();\n        // Index (status, user_id): directly seek status=1 range, stream-group without HashMap\n        int groupedRows = 0;\n        int keptGroups = 0;\n        int prevUser = -1;\n        for (int uid : paidUserIdsSorted) {\n            groupedRows++;\n            if (uid != prevUser) {\n                keptGroups++;\n                prevUser = uid;\n            }\n        }\n\n        long ms = (System.nanoTime() - start) / 1_000_000;\n        System.out.println(\"groupedRows=\" + groupedRows);\n        System.out.println(\"expected=\" + paidCount);\n        System.out.println(\"keptGroups=\" + keptGroups);\n        System.out.println(\"ms=\" + ms);\n    }\n}\n","WherePlusHaving":"package lab.wherehaving;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class WherePlusHaving {\n    public static void main(String[] args) {\n        int rows = Integer.parseInt(args[0]);\n        int[] userIds = new int[rows];\n        int[] status = new int[rows];\n        for (int i = 0; i \u003c rows; i++) {\n            userIds[i] = i % 5000;\n            status[i] = (i % 10 == 0) ? 1 : 0;\n        }\n\n        long start = System.nanoTime();\n        // Best practice: WHERE filters rows, HAVING filters aggregated groups (COUNT(*) >= 3)\n        Map\u003cInteger, Integer> groupMap = new HashMap\u003c>();\n        int groupedRows = 0;\n        for (int i = 0; i \u003c rows; i++) {\n            if (status[i] != 1) continue;\n            groupedRows++;\n            groupMap.merge(userIds[i], 1, Integer::sum);\n        }\n        int keptGroups = 0;\n        for (int cnt : groupMap.values()) {\n            if (cnt >= 3) keptGroups++;\n        }\n\n        long ms = (System.nanoTime() - start) / 1_000_000;\n        System.out.println(\"groupedRows=\" + groupedRows);\n        System.out.println(\"expected=\" + (rows / 10));\n        System.out.println(\"keptGroups=\" + keptGroups);\n        System.out.println(\"ms=\" + ms);\n    }\n}\n"},"paths":{"HavingFilter":"src/lab/wherehaving/HavingFilter.java","WhereBeforeGroup":"src/lab/wherehaving/WhereBeforeGroup.java","IndexedWhere":"src/lab/wherehaving/IndexedWhere.java","WherePlusHaving":"src/lab/wherehaving/WherePlusHaving.java"},"shown":{"HavingFilter":"java -cp out lab.wherehaving.HavingFilter","WhereBeforeGroup":"java -cp out lab.wherehaving.WhereBeforeGroup","IndexedWhere":"java -cp out lab.wherehaving.IndexedWhere","WherePlusHaving":"java -cp out lab.wherehaving.WherePlusHaving"},"results":{"id":"wherehaving","variants":{"HavingFilter":{"hash":"163c49ddf71afe06","repeat":10,"runs":{"50000":[{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":37},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":39},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":45},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":42},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":60},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":27},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":32},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":53},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":50},{"groupedRows":50000,"expected":5000,"keptGroups":500,"ms":24}],"100000":[{"groupedRows":100000,"expected":10000,"keptGroups":500,"ms":37},{"groupedRows":100000,"expected":10000,"keptGroups":500,"ms":52},{"groupedRows":100000,"expected":10000,"keptGroups":500,"ms":29},{"groupedRows":100000,"expected":10000,"keptGroups":500,"ms":57},{"groupedRows":100000,"expected":10000,"keptGroups":500,"ms":47},{"groupedRows":100000,"expected":10000,"keptGr oreGroup` 和 `IndexedWhere`，送进 GROUP BY 的行数直接砍掉 90% 降到 3 万行！"},{"t":"reveal","of":"p2","say":"切到 `IndexedWhere` 后问题彻底清零，同时兼顾性能与正确性。"},{"t":"try","say":"自己拨动上面的规模开关，对比错误数和耗时随规模的变化。"}]},{"beat":"fix","title":"修好了，各自代价是多少？","bridge":"把四种方案在不同规模下的耗时和正确性画成折线图，工程选型靠数据说话。","blocks":[{"t":"chart","of":"wherehaving","say":"总行数涨到 60 万时，`HavingFilter` 耗时陡增；`IndexedWhere` 既少扫 90% 行又免去哈希表分配，始终贴近 0ms。","walk":[{"focus":"HavingFilter","say":"看 `用 HAVING 过滤状态`：先把 30 万行全塞进 GROUP BY 哈希表，最后再用 HAVING 扔掉 90%。"},{"focus":"WhereBeforeGroup","say":"看 `WHERE 先过滤再分组`：先用 WHERE 筛出 10% 的 PAID 行，再送进 GROUP BY。"},{"focus":"IndexedWhere","say":"看 `联合索引流式分组`：建 (status, user_id) 索引，直接定位 status=PAID 且按 user_id 有序流式计数。"},{"focus":"WherePlusHaving","say":"看 `WHERE+HAVING 各司其职`：WHERE 滤行状态，HAVING 滤聚合结果（如 COUNT(*) >= 3）。"}]}]},{"beat":"choose","title":"工程上到底怎么选？","bridge":"没有银弹，只有适用边界。把每种方案的优点、代价和适用场景摆成一张表。","blocks":[{"t":"choose","say":"行条件放 `WHERE`，聚合条件放 `HAVING`，高频分组建联合索引。","options":[{"name":"HavingFilter (错用 HAVING)","solves":"无优势","cost":"全表进临时表：{ms:wherehaving.HavingFilter} ms","when":"永远禁止把行过滤放 HAVING","say":"内存杀手。"},{"name":"WhereBeforeGroup","solves":"分组前先淘汰 90% 行","cost":"分组量减 90%：{ms:wherehaving.WhereBeforeGroup} ms","when":"常规带过滤条件的分组查询","say":"基本底线。"},{"name":"IndexedWhere (联合索引流式)","solves":"流式计数免临时表","cost":"最低耗时：{ms:wherehaving.IndexedWhere} ms","when":"高频大表分组统计（消 Using temporary）","say":"性能天花板。"}]}]},{"beat":"check","title":"两道巩固题：检验是否真懂","bridge":"学完立刻做两道高频面试陷阱题，看看能不能一眼识破。","blocks":[{"t":"quiz","id":"q1","q":"SQL 标准的逻辑执行顺序，哪一项是正确的？","options":[{"text":"FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY","ok":true,"why":"先过滤行(WHERE)，再分组(GROUP BY)，再过滤组(HAVING)，最后投影和排序。"},{"text":"SELECT → FROM → WHERE → GROUP BY → HAVING","ok":false,"why":"SELECT 投影列在 GROUP BY/HAVING 之后才执行。"},{"text":"FROM → GROUP BY → HAVING → WHERE → SELECT","ok":false,"why":"WHERE 永远在 GROUP BY 之前。"}],"say":"第一题：选最精准的那一项。"},{"t":"quiz","id":"q2","q":"对于 `SELECT user_id, COUNT(*) FROM orders WHERE status = 'PAID' GROUP BY user_id`，建哪个联合索引能消除 Using temporary？","options":[{"text":"(status, user_id)","ok":true,"why":"等值列 status 在前定死区间，user_id 在后天然有序，直接流式计数。"},{"text":"(user_id, status)","ok":false,"why":"跳过了最左前缀 user_id，无法直接定位 status='PAID' 区间。"},{"text":"(create_time)","ok":false,"why":"跟查询条件和分组列无关。"}],"say":"第二题：换个问法考同一个底层原理。"}]},{"beat":"name","title":"把概念装进脑子：标准叫法与面试原题","bridge":"前面一直用大白话和实验推演，现在给它贴上面试官认可的专业名词。","blocks":[{"t":"term","name":"WHERE 与 HAVING 及流式分组","alias":"WHERE vs HAVING & Streaming Group","one":"==WHERE 分组前滤行（可走索引），HAVING 分组后滤聚合结果==；建 ==(WHERE等值列, GROUP BY列)== 联合索引可消除 Using temporary。","say":"记住这一句核心定义，面试时先抛结论再展开。"},{"t":"asked","questions":["WHERE 和 HAVING 的区别是什么？SQL 执行顺序是怎样的？","为什么把普通条件写在 WHERE 比写在 HAVING 快得多？","如何用联合索引消除 GROUP BY 的 Using temporary？"],"say":"这几道都是真实一二面原题，下一页直接练习脱稿讲。"}]},{"beat":"say","title":"合上课件，开口讲一遍","bridge":"看懂不等于讲得出来。对着计时器，按要点一口气讲顺。","blocks":[{"t":"say","prompt":"讲清楚 WHERE 与 HAVING 的执行顺序与职责区别，以及如何用联合索引优化 GROUP BY？","seconds":90,"points":["SQL 执行顺序是 FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY","WHERE 在分组前做行级过滤且能走索引；HAVING 在分组后对聚合结果（COUNT/SUM）过滤，错放会让全表进临时表","按 WHERE 等值列 + GROUP BY 列建联合索引 (status, user_id)，可实现有序流式分组，消除 Using temporary"],"model":"WHERE 和 HAVING 的核心区别在于执行时机和作用对象。SQL 执行顺序是先 FROM、WHERE，再 GROUP BY，最后才执行 HAVING。WHERE 是在分组前做行级过滤，能利用索引直接筛掉无关行；而 HAVING 是在分组聚合之后对聚合结果（比如 COUNT(*) >= 3）做过滤。如果把普通字段条件误写进 HAVING，就会先把全表数据塞进 GROUP BY 临时表再丢弃，导致内存和耗时暴涨。配合 (status, user_id) 联合索引还能有序流式分组，连临时表都不用建。","say":"先自己组织语言讲一遍，再点开参考答案对照漏了哪个得分点。"}]},{"beat":"take","title":"带走三张复习卡片","bridge":"最后留三张一问一答卡片，考前扫一眼就能全部唤醒。","blocks":[{"t":"cards","cards":[{"q":"WHERE 和 HAVING 谁先执行？","a":"WHERE 在 GROUP BY 前过滤行；HAVING 在 GROUP BY 后过滤聚合组。"},{"q":"普通条件放 HAVING 为什么慢？","a":"无法走索引剪枝，会把全表无关行全塞进 GROUP BY 临时表再扔掉。"},{"q":"怎么消除 GROUP BY 的 Using temporary？","a":"建 (WHERE 等值列, GROUP BY 列) 联合索引，实现有序流式分组。"}],"say":"这三张卡片就是本课的最小精华，全部通关，进入下一课！"}]}]}</script>
<script>
/* Shared pieces of the lesson page: element building, inline marks, Java colouring, the code view, a line diff, saved state.
   Text always goes in as text nodes; nothing a lesson writes is parsed as HTML. */
(function () {
  "use strict";
  const L = (window.Lesson = { blocks: {} });

  /** h("div.a.b", { text, on: { click }, attr: {…} }, child, child…) */
  L.h = function (spec, props, ...kids) {
    const [tag, ...classes] = spec.split(".");
    const el = document.createElement(tag || "div");
    if (classes.length) el.className = classes.join(" ");
    if (props) {
      if (props.text !== undefined) el.textContent = props.text;
      for (const [name, value] of Object.entries(props.attr || {})) el.setAttribute(name, value);
      for (const [name, fn] of Object.entries(props.on || {})) el.addEventListener(name, fn);
    }
    for (const kid of kids.flat()) if (kid) el.append(kid);
    return el;
  };

  L.num = (value) => Number(value).toLocaleString("en-US");

  /** **bold**, `code` and ==mark== inside a sentence. */
  L.md = function (text) {
    const out = document.createDocumentFragment();
    const pattern = /\*\*([^*]+)\*\*|`([^`]+)`|==([^=]+)==/g;
    let last = 0;
    for (let hit = pattern.exec(text); hit; hit = pattern.exec(text)) {
      out.append(text.slice(last, hit.index));
      out.append(hit[1] ? L.h("b", { text: hit[1] }) : hit[2] ? L.term(hit[2], L.h("code", { text: hit[2] })) : L.h("mark", { text: hit[3] }));
      last = pattern.lastIndex;
    }
    out.append(text.slice(last));
    return out;
  };

  const JAVA = new Set("abstract boolean break byte case catch char class continue default do double else enum extends final finally float for if implements import instanceof int interface long new null package private protected public record return short static super switch synchronized this throw throws try var void volatile while true false".split(" "));
  const PYTHON = new Set("and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None".split(" "));
  const LANGS = { java: { words: JAVA, comment: "//" }, python: { words: PYTHON, comment: "#" }, text: { words: new Set(), comment: "\n" } };
  const TOKEN = /(\/\/.*$|#.*$)|("(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)')|\b(\d[\d_]*(?:\.\d+)?[LlFfDd]?)\b|\b([A-Za-z_]\w*)\b/g;

  /** One line of code as coloured spans. */
  L.colour = function (line, lang) {
    const { words, comment } = LANGS[lang] || LANGS.text;
    const out = document.createDocumentFragment();
    let last = 0;
    TOKEN.lastIndex = 0;
    for (let hit = TOKEN.exec(line); hit; hit = TOKEN.exec(line)) {
      const kind = hit[1] ? (hit[1].startsWith(comment) ? "c" : "") : hit[2] || hit[3] ? "s" : hit[4] ? "n" : words.has(hit[5]) ? "k" : "";
      out.append(line.slice(last, hit.index));
      out.append(kind ? L.h(`span.tk-${kind}`, { text: hit[0] }) : hit[0]);
      last = TOKEN.lastIndex;
    }
    out.append(line.slice(last));
    return out;
  };

  /* Reminders at the moment of need: a word the learner may not know is explained where it stands, on hover, focus or tap. */
  L.glossary = {};
  const tip = L.h("div.tip", { attr: { role: "tooltip", id: "lesson-tip", hidden: "" } });
  let tipFor = null, tipTimer = 0;

    clearTimeout(tipTimer);

    tip.replaceChildren(L.h("b.mono", { text: word }), L.h("span", null, L.md(L.glossary[word])));

    const changed = [];

  L.codeView = function () {

    const label = L.h("div.code__path");
    const el = L.h("div.code", null, label, scroll);
    return {
      el,
      /** Calls fn(lineNumber) when the learner presses a line. */
      onLine(fn) { scroll.addEventListener("click", (event) => { const row = event.target.closest(".code__line"); if (row) fn([...scroll.children].indexOf(row) + 1); }); },
      show(source, { path = "", lang = "text", focus = [], changed = [], wrong = [], tags = {} } = {}) {
        label.textContent = path;

        scroll.replaceChildren(...source.split("\n").map((line, i) => {
          const state = changed.includes(i + 1) ? ".is-changed" : focus.includes(i + 1) ? ".is-focus" : wrong.includes(i + 1) ? ".is-wrong" : "";

        }));

  /** A row of mutually exclusive choices. `options` are { id, label }. */
  L.segmented = function (label, options, selected, onPick) {

  L.memory = function (key) {
    let data = {};
    try { data = JSON.parse(localStorage.getItem(key) || "{}"); } catch { data = {}; }

      get: (name, fallback) => (name in data ? data[name] : fallback),
      set(name, value) { data[name] = value; try { localStorage.setItem(key, JSON.stringify(data)); } catch { /* private window */ } },
    };
  };

<script>
/* The plain blocks of a lesson. Each maker takes (block, ctx) and returns { el, steps?, set?, ready?, refresh? }:
   steps = teacher sentences for moments inside the block after it has appeared; set(k) shows it as of step k;
   ready() false means the learner still has to act before the lesson moves on; refresh() runs each time the block is revealed. */
(function () {
  "use strict";
  const L = window.Lesson, h = L.h;
  const KEYS = "ABCD";

  L.blocks.text = (block) => ({ el: h("p.text", null, L.md(block.md)) });

  /** A row of small answer buttons. paint(picked, right) locks them once an answer is in and marks the right and the wrong one. */
  function picks(labels, onPick, extra = "") {
    const buttons = labels.map((text, i) => h(`button.pick${extra}`, { attr: { type: "button" }, on: { click: () => onPick(i) } }, L.md(text)));
    return {
      el: h("div.picks", null, buttons),
      paint(picked, right) {
        buttons.forEach((button, i) => {
          button.disabled = picked !== undefined;
          button.classList.toggle("is-right", picked !== undefined && i === right);
          button.classList.toggle("is-wrong", picked === i && i !== right);

      },

  }

  /** Several small questions answered on the spot. make(item, i) gives each row's content; the answers survive a reload. */

    const key = `${name}:${block.items.length}:${block.items[0].q || block.items[0].text}`;
    const answers = ctx.memory.get(key, {});

    const rows = block.items.map((item, i) => {
      const why = h(`p.${name}__why`, { attr: { hidden: "" } }, L.md(item.why));
      const row = make(item, (j) => { answers[i] = j; ctx.memory.set(key, answers); paint(); (done() ? score : why).scrollIntoView({ block: "nearest", behavior: "smooth" }); });
      return { item, why, pick: row.pick, el: h(`div.${name}__item`, null, row.head, row.pick.el, why) };
    });
    const done = () => rows.every((row, i) => answers[i] !== undefined);
    function paint() {
      rows.forEach((row, i) => { row.pick.paint(answers[i], row.item.answer); row.why.hidden = answers[i] === undefined; });
      score.textContent = done() ? sum(rows.filter((row, i) => answers[i] === row.item.answer).length, rows.length) : "";

    paint();
    return { el: h(`div.${name}`, null, rows.map((row) => row.el), score), ready: done, waitSay: "先把这几道都点一下再往下。点错没关系；实在想跳过，再按一次。" };
  }

  /** "You have met these before": a quick question per thing the lesson builds on, with the one sentence needed if it has faded. */
  L.blocks.recall = (block, ctx) => answered(block, ctx, "recall",
    (item, onPick) => ({ head: [h("span.recall__have", null, L.md(item.have)), h("p.recall__q", null, L.md(item.q))], pick: picks(item.options, onPick) }),
    (right, total) => (right === total ? `${total} 样都记得，可以开始了。` : `${total} 样里记得 ${right} 样。没记住的，把它下面那句话再看一眼，这节课够用了。`));

  /** Apply the rule just learned: for each situation, pick the tool. */

    (item, onPick) => ({ head: [h("p.cases__text", null, L.md(item.text))], pick: picks(block.tools, (j) => { onPick(j); document.dispatchEvent(new CustomEvent("lesson:picked", { detail: { name: block.tools[item.answer] } })); }, ".pick--tool") }),
    (right, total) => (right === total ? `${total} 个场景都选对了。这条规则是你的了。` : `${total} 个里选对 ${right} 个。看一眼没选对的那条理由，再回想那句规则。`));

  /** A picture to hang the lesson on: a short everyday story, then what each thing in it is called in the program. */

    const rows = block.map.map((pair) => h("div.scene__row", null, h("span", null, L.md(pair.scene)), h("span.scene__arrow", { text: "→" }), h("span.scene__to", null, L.md(pair.code))));
    const table = h("div.scene__map", null, h("div.scene__head", null, h("span", { text: "场景里" }), h("span"), h("span", { text: "程序里" })), rows);
    const picture = block.picture ? L.sharePicture({ actors: block.picture.actors, shared: block.picture.shared.name, hands: false }) : null;
    /* The picture starts as the everyday scene; each row that is reached pins the program's word onto the part it names. */
    const draw = (k) => {
      const tags = { actors: [], shared: [], action: "" };
      block.map.slice(0, k).forEach((pair) => { if (pair.on === "action") tags.action = pair.tag; else if (pair.on) tags[pair.on].push(pair.tag); });

    set(0);
    return { el: h("div.scene", null, h("p.scene__story", null, L.md(block.story)), h(`div.scene__body${picture ? ".has-picture" : ""}`, null, table, picture?.el)), steps: block.map.map((pair) => ({ say: pair.say })), set };
  };

  /** "Which line is it?" The learner presses the line they suspect, on the real source. */
  L.blocks.spot = (block, ctx) => {
    const key = `spot:${block.of}:${block.answerLines.join("-")}`;
    const view = L.codeView();
    const out = h("p.spot__out", { attr: { "aria-live": "polite" } });
    let found = ctx.memory.get(key, false), wrong = [];
    function paint() {

      ready: () => found,
      waitSay: "先在代码上点一行你怀疑的。点错会有提示；实在想跳过，再按一次。",
      pass() { found = true; wrong = []; paint(); },

  /** Evidence: what the built program looks like inside, as the lab's inspect command printed it. Labels are added as the teacher names each part. */
  L.blocks.inside = (block) => {
    const view = L.codeView();
    const show = (k) => view.show(block.source, {
      path: block.command, lang: "text", focus: k ? block.walk[k - 1].focusLines : [],
      tags: Object.fromEntries(block.walk.slice(0, k).map((step) => [step.focusLines.at(-1), step.label])),
    });
    show(0);
    return { el: h("div.inside", null, h("p.inside__what", { text: "这是工具打印出来的真实输出，不是示意图。" }), view.el), steps: block.walk.map((step) => ({ say: step.say, key: step.key })), set: show };
  };

  /** The teacher hands over the controls: nothing new appears, the switches of the experiment on this slide light up once. */
  L.blocks.try = () => {
    const el = h("span.try");
    return {
      el,
      refresh() {
        for (const exp of el.closest(".slide").querySelectorAll(".exp")) { exp.classList.remove("is-invited"); void exp.offsetWidth; exp.classList.add("is-invited"); }

  };

  L.blocks.points = (block) => ({ el: h("ul.points", null, block.items.map((item) => h("li", null, h("span", null, L.md(item))))) });

  L.blocks.callout = (block) => ({ el: h(`div.callout.callout--${block.tone}`, null, h("h4", { text: block.title }), h("p", null, L.md(block.md))) });

  L.blocks.code = (block) => {
    const view = L.codeView();
    const walk = block.walk || [];
    const show = (focus) => view.show(block.source, { path: block.path, lang: block.lang, focus });
    show(block.focusLines);
    return { el: view.el, steps: walk.map((step) => ({ say: step.say, key: step.key })), set(k) { show(k ? walk[k - 1].focusLines : block.focusLines); } };
  };

  function option(index, text, onPick) {
    const tag = h("span.opt__tag");
    const el = h("button.opt", { attr: { type: "button" }, on: { click: () => onPick(index) } }, h("span.opt__key", { text: KEYS[index] }), h("span", null, L.md(text)), tag);
    return { el, tag };
  }

  /** Guess first. Nothing is confirmed here: the answer comes from the run, in the matching reveal block. */
  L.blocks.predict = (block, ctx) => {
    const key = `predict:${block.id}`;
    const options = block.options.map((text, i) => option(i, text, pick));
    function paint() {
      const picked = ctx.memory.get(key);
      options.forEach((item, i) => { item.el.classList.toggle("is-picked", i === picked); item.tag.textContent = i === picked ? "你的猜测" : ""; });
    }
    function pick(index) { ctx.memory.set(key, index); paint(); }
    paint();
    return { el: h("div.predict", null, h("p.predict__q", null, L.md(block.q)), h("div.opts", null, options.map((item) => item.el))), ready: () => ctx.memory.get(key) !== undefined };
  };

  /** After the run: the learner's guess beside what really happened. The explaining is the teacher's job, not this block's. */
  L.blocks.reveal = (block, ctx) => {
    const predict = ctx.predicts[block.of];
    const guess = h("dd");
    return {
      el: h("div.reveal", null, h("dl", null, h("dt", { text: "你猜的" }), guess), h("dl", null, h("dt", { text: "实际" }), h("dd.is-ok", null, L.md(predict.options[predict.answer])))),
      refresh() {
        const picked = ctx.memory.get(`predict:${block.of}`);
        guess.className = picked === undefined ? "" : picked === predict.answer ? "is-ok" : "is-miss";

  };

  /** Several tools side by side: what each solves, what it costs, when to reach for it. The teacher goes through them one row at a

  L.blocks.choose = (block) => {

      h("span.choose__name", null, L.term(option.name, h("span", { text: option.name }))),

    const set = (k) => {

      h("div.name__asked", null, h("h4", { text: "面试里它长这样" }), h("ul", null, block.asked.map((question) => h("li", { text: `「${question}」` })))),
    ),
  });

  /** Answered on the spot: the picked option and the right one both show why. */
  L.blocks.quiz = (block) => {
    let done = false;

        if (i !== index && !item.ok) return;

  };

  L.blocks.say = (block) => {
    const total = block.seconds || 120;

    const clock = h("span.say__clock");

    const points = h("ul.say__points", { attr: { hidden: "" } }, block.points.map((point, i) => h("li", null, h("label", null, boxes[i], h("span", null, L.md(point))))), score);
    const start = h("button.btn", { text: "开始讲", attr: { type: "button" }, on: { click: toggle } });
    const model = h("p.say__model", { attr: { hidden: "" } }, L.md(block.model));

    const check = h("button.btn.btn--primary", { text: "讲完了，对要点", attr: { type: "button" }, on: { click() { stop(); points.hidden = false; check.hidden = true; showModel.hidden = false; count(); } } });
    function draw() { clock.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; }

  };

    el: h("div.cards", null, block.items.map((card) => {

      const button = h("button.btn.btn--quiet", { text: "看答案", attr: { type: "button" }, on: { click() { answer.hidden = !answer.hidden; button.textContent = answer.hidden ? "看答案" : "收起"; } } });
      return h("div.card", null, h("p.card__q", null, L.md(card.q)), button, answer);
    })),
  });
})();
