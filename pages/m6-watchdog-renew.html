<script>
/* The plain blocks of a lesson. Each maker takes (block, ctx) and returns { el, steps?, set?, ready?, refresh? }:
   steps = teacher sentences for moments inside the block after it has appeared; set(k) shows it as of step k;
   ready() false means the learner still has to act before the lesson moves on; refresh() runs each time the block is revealed. */
(function () {
  "use strict";
  const L = window.Lesson, h = L.h;
  const KEYS = "ABCD";

  L.blocks.text = (block) => ({ el: h("p.text", null, L.md(block.md)) });

  /** A row of small answer buttons. paint(picked, right) locks them once an answer is in and marks the right and the wrong one. */
  function picks(labels, onPick, extra = "") {
    const buttons = labels.map((text, i) => h(`button.pick${extra}`, { attr: { type: "button" }, on: { click: () => onPick(i) } }, L.md(text)));
    return {
      el: h("div.picks", null, buttons),
      paint(picked, right) {
        buttons.forEach((button, i) => {
          button.disabled = picked !== undefined;
          button.classList.toggle("is-right", picked !== undefined && i === right);
          button.classList.toggle("is-wrong", picked === i && i !== right);
        });
      },
    };
  }

  /** Several small questions answered on the spot. make(item, i) gives each row's content; the answers survive a reload. */
  function answered(block, ctx, name, make, sum) {
    const key = `${name}:${block.items.length}:${block.items[0].q || block.items[0].text}`;
    const answers = ctx.memory.get(key, {});
    const score = h(`p.${name}__score`, { attr: { "aria-live": "polite" } });
    const rows = block.items.map((item, i) => {
      const why = h(`p.${name}__why`, { attr: { hidden: "" } }, L.md(item.why));
      const row = make(item, (j) => { answers[i] = j; ctx.memory.set(key, answers); paint(); (done() ? score : why).scrollIntoView({ block: "nearest", behavior: "smooth" }); });
      return { item, why, pick: row.pick, el: h(`div.${name}__item`, null, row.head, row.pick.el, why) };
    });
    const done = () => rows.every((row, i) => answers[i] !== undefined);
    function paint() {
      rows.forEach((row, i) => { row.pick.paint(answers[i], row.item.answer); row.why.hidden = answers[i] === undefined; });
      score.textContent = done() ? sum(rows.filter((row, i) => answers[i] === row.item.answer).length, rows.length) : "";
    }
    paint();
    return { el: h(`div.${name}`, null, rows.map((row) => row.el), score), ready: done, waitSay: "先把这几道都点一下再往下。点错没关系；实在想跳过，再按一次。" };
  }

  /** "You have met these before": a quick question per thing the lesson builds on, with the one sentence needed if it has faded. */
  L.blocks.recall = (block, ctx) => answered(block, ctx, "recall",
    (item, onPick) => ({ head: [h("span.recall__have", null, L.md(item.have)), h("p.recall__q", null, L.md(item.q))], pick: picks(item.options, onPick) }),
    (right, total) => (right === total ? `${total} 样都记得，可以开始了。` : `${total} 样里记得 ${right} 样。没记住的，把它下面那句话再看一眼，这节课够用了。`));

  /** Apply the rule just learned: for each situation, pick the tool. */
  L.blocks.cases = (block, ctx) => answered(block, ctx, "cases",
    (item, onPick) => ({ head: [h("p.cases__text", null, L.md(item.text))], pick: picks(block.tools, (j) => { onPick(j); document.dispatchEvent(new CustomEvent("lesson:picked", { detail: { name: block.tools[item.answer] } })); }, ".pick--tool") }),
    (right, total) => (right === total ? `${total} 个场景都选对了。这条规则是你的了。` : `${total} 个里选对 ${right} 个。看一眼没选对的那条理由，再回想那句规则。`));

  /** A picture to hang the lesson on: a short everyday story, then what each thing in it is called in the program. */
  L.blocks.scene = (block) => {
    const rows = block.map.map((pair) => h("div.scene__row", null, h("span", null, L.md(pair.scene)), h("span.scene__arrow", { text: "→" }), h("span.scene__to", null, L.md(pair.code))));
    const table = h("div.scene__map", null, h("div.scene__head", null, h("span", { text: "场景里" }), h("span"), h("span", { text: "程序里" })), rows);
    const picture = block.picture ? L.sharePicture({ actors: block.picture.actors, shared: block.picture.shared.name, hands: false }) : null;
    /* The picture starts as the everyday scene; each row that is reached pins the program's word onto the part it names. */
    const draw = (k) => {
      const tags = { actors: [], shared: [], action: "" };
      block.map.slice(0, k).forEach((pair) => { if (pair.on === "action") tags.action = pair.tag; else if (pair.on) tags[pair.on].push(pair.tag); });
      picture.set({ value: block.picture.shared.value, tags, hot: k ? block.map[k - 1].on || null : null });
    };
    const set = (k) => { table.classList.toggle("is-waiting", k === 0); rows.forEach((row, i) => { row.classList.toggle("is-waiting", i >= k); row.classList.toggle("is-now", i === k - 1); }); if (picture) draw(k); };
    set(0);
    return { el: h("div.scene", null, h("p.scene__story", null, L.md(block.story)), h(`div.scene__body${picture ? ".has-picture" : ""}`, null, table, picture?.el)), steps: block.map.map((pair) => ({ say: pair.say })), set };
  };

  /** "Which line is it?" The learner presses the line they suspect, on the real source. */
  L.blocks.spot = (block, ctx) => {
    const key = `spot:${block.of}:${block.answerLines.join("-")}`;
    const view = L.codeView();
    const out = h("p.spot__out", { attr: { "aria-live": "polite" } });
    let found = ctx.memory.get(key, false), wrong = [];
    function paint() {
      view.show(block.source, { path: block.path, lang: block.lang, focus: found ? block.answerLines : [], wrong });
      view.el.classList.toggle("is-pickable", !found);
      out.className = `spot__out${found ? ".is-ok" : wrong.length ? ".is-miss" : ""}`.replace(/\./g, " ");
      out.replaceChildren(found ? L.md(block.found) : wrong.length ? L.md(block.hint) : "");
    }
    view.onLine((n) => {
      if (found) return;
      if (block.answerLines.includes(n)) { found = true; wrong = []; ctx.memory.set(key, true); } else wrong = [n];
      paint();
    });
    paint();
    return {
      el: h("div.spot", null, h("p.spot__q", null, L.md(block.q)), view.el, h("div.spot__side", null, h("p.spot__how", { text: "在左边的代码上，点你怀疑的那一行。" }), out)),
      ready: () => found,
      waitSay: "先在代码上点一行你怀疑的。点错会有提示；实在想跳过，再按一次。",
      pass() { found = true; wrong = []; paint(); },
    };
  };

  /** Evidence: what the built program looks like inside, as the lab's inspect command printed it. Labels are added as the teacher names each part. */
  L.blocks.inside = (block) => {
    const view = L.codeView();
    const show = (k) => view.show(block.source, {
      path: block.command, lang: "text", focus: k ? block.walk[k - 1].focusLines : [],
      tags: Object.fromEntries(block.walk.slice(0, k).map((step) => [step.focusLines.at(-1), step.label])),
    });
    show(0);
    return { el: h("div.inside", null, h("p.inside__what", { text: "这是工具打印出来的真实输出，不是示意图。" }), view.el), steps: block.walk.map((step) => ({ say: step.say, key: step.key })), set: show };
  };

  /** The teacher hands over the controls: nothing new appears, the switches of the experiment on this slide light up once. */
  L.blocks.try = () => {
    const el = h("span.try");
    return {
      el,
      refresh() {
        for (const exp of el.closest(".slide").querySelectorAll(".exp")) { exp.classList.remove("is-invited"); void exp.offsetWidth; exp.classList.add("is-invited"); }
      },
    };
  };

  L.blocks.points = (block) => ({ el: h("ul.points", null, block.items.map((item) => h("li", null, h("span", null, L.md(item))))) });

  L.blocks.callout = (block) => ({ el: h(`div.callout.callout--${block.tone}`, null, h("h4", { text: block.title }), h("p", null, L.md(block.md))) });

  L.blocks.code = (block) => {
    const view = L.codeView();
    const walk = block.walk || [];
    const show = (focus) => view.show(block.source, { path: block.path, lang: block.lang, focus });
    show(block.focusLines);
    return { el: view.el, steps: walk.map((step) => ({ say: step.say, key: step.key })), set(k) { show(k ? walk[k - 1].focusLines : block.focusLines); } };
  };

  function option(index, text, onPick) {
    const tag = h("span.opt__tag");
    const el = h("button.opt", { attr: { type: "button" }, on: { click: () => onPick(index) } }, h("span.opt__key", { text: KEYS[index] }), h("span", null, L.md(text)), tag);
    return { el, tag };
  }

  /** Guess first. Nothing is confirmed here: the answer comes from the run, in the matching reveal block. */
  L.blocks.predict = (block, ctx) => {
    const key = `predict:${block.id}`;
    const options = block.options.map((text, i) => option(i, text, pick));
    function paint() {
      const picked = ctx.memory.get(key);
      options.forEach((item, i) => { item.el.classList.toggle("is-picked", i === picked); item.tag.textContent = i === picked ? "你的猜测" : ""; });
    }
    function pick(index) { ctx.memory.set(key, index); paint(); }
    paint();
    return { el: h("div.predict", null, h("p.predict__q", null, L.md(block.q)), h("div.opts", null, options.map((item) => item.el))), ready: () => ctx.memory.get(key) !== undefined };
  };

  /** After the run: the learner's guess beside what really happened. The explaining is the teacher's job, not this block's. */
  L.blocks.reveal = (block, ctx) => {
    const predict = ctx.predicts[block.of];
    const guess = h("dd");
    return {
      el: h("div.reveal", null, h("dl", null, h("dt", { text: "你猜的" }), guess), h("dl", null, h("dt", { text: "实际" }), h("dd.is-ok", null, L.md(predict.options[predict.answer])))),
      refresh() {
        const picked = ctx.memory.get(`predict:${block.of}`);
        guess.className = picked === undefined ? "" : picked === predict.answer ? "is-ok" : "is-miss";
        guess.replaceChildren(picked === undefined ? "刚才没猜" : L.md(predict.options[picked]));
      },
    };
  };

  /** Several tools side by side: what each solves, what it costs, when to reach for it. The teacher goes through them one row at a
      time, and the rule to choose by comes last, after every row has been talked through. */
  L.blocks.choose = (block) => {
    const rows = block.options.map((option) => h("div.choose__row", null,
      h("span.choose__name", null, L.term(option.name, h("span", { text: option.name }))),
      h("span", { attr: { "data-label": "解决什么" } }, L.md(option.solves)),
      h("span", { attr: { "data-label": "代价" } }, L.md(option.cost)),
      h("span", { attr: { "data-label": "什么时候用" } }, L.md(option.when))));
    const rule = h("p.choose__rule", null, L.md(block.rule));
    const el = h("div.choose", null,
      h("div.choose__head", null, h("span"), h("span", { text: "解决什么" }), h("span", { text: "代价" }), h("span", { text: "什么时候用" })), rows, rule);
    const set = (k) => {
      const walking = k >= 1 && k <= rows.length;
      el.classList.toggle("is-walking", walking);
      rows.forEach((row, i) => row.classList.toggle("is-now", walking && i === k - 1));
      rule.classList.toggle("is-waiting", k <= rows.length);
    };
    set(0);
    return { el, steps: block.options.map((option) => ({ say: option.say })).concat({ say: block.ruleSay, key: block.ruleKey }), set };
  };

  L.blocks.name = (block) => ({
    el: h("div.name", null,
      h("h2.name__term", { text: block.term }),
      block.alias ? h("p.name__alias", { text: block.alias }) : null,
      h("p.name__line", null, L.md(block.oneLine)),
      h("div.name__asked", null, h("h4", { text: "面试里它长这样" }), h("ul", null, block.asked.map((question) => h("li", { text: `「${question}」` })))),
    ),
  });

  /** Answered on the spot: the picked option and the right one both show why. */
  L.blocks.quiz = (block) => {
    let done = false;
    const options = block.options.map((item, i) => option(i, item.text, pick));
    function pick(index) {
      if (done) return;
      done = true;
      block.options.forEach((item, i) => {
        if (i !== index && !item.ok) return;
        options[i].el.classList.add(item.ok ? "is-right" : "is-wrong");
        options[i].tag.textContent = item.ok ? "对" : "不对";
        options[i].el.append(h("span.opt__why", null, L.md(item.why)));
      });
    }
    return { el: h("div.quiz", null, h("p.quiz__q", null, L.md(block.q)), h("div.opts", null, options.map((item) => item.el))), ready: () => done };
  };

  /** Say it aloud against a clock, then tick off what you covered. The points stay hidden until the learner has spoken. */
  L.blocks.say = (block) => {
    const total = block.seconds || 120;
    let left = total, timer = 0;
    const clock = h("span.say__clock");
    const score = h("p.say__score");
    const boxes = block.points.map((point) => h("input", { attr: { type: "checkbox" }, on: { change: count } }));
    const points = h("ul.say__points", { attr: { hidden: "" } }, block.points.map((point, i) => h("li", null, h("label", null, boxes[i], h("span", null, L.md(point))))), score);
    const start = h("button.btn", { text: "开始讲", attr: { type: "button" }, on: { click: toggle } });
    const model = h("p.say__model", { attr: { hidden: "" } }, L.md(block.model));
    const showModel = h("button.btn", { text: "看一份参考回答", attr: { type: "button", hidden: "" }, on: { click() { model.hidden = !model.hidden; showModel.textContent = model.hidden ? "看一份参考回答" : "收起参考回答"; if (!model.hidden) model.scrollIntoView({ block: "nearest", behavior: "smooth" }); } } });
    const check = h("button.btn.btn--primary", { text: "讲完了，对要点", attr: { type: "button" }, on: { click() { stop(); points.hidden = false; check.hidden = true; showModel.hidden = false; count(); } } });
    function draw() { clock.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; }
    function stop() { clearInterval(timer); timer = 0; start.textContent = left === total ? "开始讲" : "接着讲"; }
    function toggle() {
      if (timer) return stop();
      if (left === 0) left = total;
      start.textContent = "暂停";
      timer = setInterval(() => { left -= 1; draw(); if (left === 0) stop(); }, 1000);
      draw();
    }
    function count() { score.textContent = `${block.points.length} 个要点，你讲到了 ${boxes.filter((box) => box.checked).length} 个。没讲到的，回到对应那一页再看一遍。`; }
    draw();
    return { el: h("div.say", null, h("p.say__prompt", null, L.md(block.prompt)), h("div.say__row", null, clock, start, check, showModel), points, model) };
  };

  L.blocks.cards = (block) => ({
    el: h("div.cards", null, block.items.map((card) => {
      const answer = h("p.card__a", { attr: { hidden: "" } }, L.md(card.a));
      const button = h("button.btn.btn--quiet", { text: "看答案", attr: { type: "button" }, on: { click() { answer.hidden = !answer.hidden; button.textContent = answer.hidden ? "看答案" : "收起"; } } });
      return h("div.card", null, h("p.card__q", null, L.md(card.q)), button, answer);
    })),
  });
})();

<script>
/* Things that are drawn instead of described. Three of them:
   - the shared-thing picture: two actors, what each holds in hand, and the one thing they share. A scene uses it to show the
     everyday story; `lanes` puts the same picture beside its rows, so every step is also seen in space, not only in time;
   - `chart`: the recorded runs as lines, one per way of writing the code, along the experiment's knob;
   - `decide`: the rule for choosing, drawn as a small tree.
   Every number in a chart is read from the recorded runs. Colour names a series and nothing else; right or wrong is the marker's shape. */
(function () {
  "use strict";
  const L = window.Lesson, h = L.h;
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs, ...kids) => {
    const el = document.createElementNS(NS, tag);
    for (const [name, value] of Object.entries(attrs || {})) el.setAttribute(name, value);
    el.append(...kids.flat().filter(Boolean));
    return el;
  };

  /* ---------- two actors and the thing they share ---------- */

  const PIC = { width: 300, height: 300 };
  const FIGURE = () => s("svg", { viewBox: "0 0 44 40", class: "pic__figure", "aria-hidden": "true" },
    s("circle", { cx: 22, cy: 10, r: 8.5 }), s("path", { d: "M4 40v-4a18 14 0 0 1 36 0v4" }));

  /** A straight arrow from (x1, y1) to (x2, y2), stopping a little short at both ends. */
  function arrow(x1, y1, x2, y2) {
    const length = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / length, uy = (y2 - y1) / length;
    const tipX = x2 - ux * 3, tipY = y2 - uy * 3, backX = tipX - ux * 9, backY = tipY - uy * 9;
    return s("g", { class: "pic__arrow" },
      s("line", { x1: x1 + ux * 3, y1: y1 + uy * 3, x2: backX, y2: backY }),
      s("polygon", { points: `${tipX},${tipY} ${backX - uy * 4.5},${backY + ux * 4.5} ${backX + uy * 4.5},${backY - ux * 4.5}` }));
  }

  /** actors: two names; shared: its name; hands: whether each actor holds a value (the scene's story has no need of it). */
  L.sharePicture = function ({ actors, shared, hands = true }) {
    const side = ["a", "b"];
    const value = h("b.pic__value");
    const boardTags = h("div.pic__tags");
    const board = h("div.pic__board", null, value);
    const boardName = h("div.pic__over", null, h("span.pic__name", { text: shared }), boardTags);
    const action = h("span.pic__action");
    const people = actors.map((name, i) => {
      const tags = h("div.pic__tags");
      const note = h("span.pic__note");
      const held = h("b");
      return {
        tags, note, held,
        el: h(`div.pic__actor.pic__actor--${side[i]}`, null, FIGURE(), h("span.pic__name", { text: name }), tags, note),
        hand: hands ? h(`div.pic__hand.pic__hand--${side[i]}`, null, h("small", { text: "手里" }), held) : null,
      };
    });
    /* With hands the arrows run between the board and a hand; without, between an actor and the board. */
    const ends = hands ? [[124, 110, 104, 144], [176, 110, 196, 144]] : [[122, 110, 62, 192], [178, 110, 238, 192]];
    const arrows = ends.map(([bx, by, px, py]) => ({ in: arrow(bx, by, px, py), out: arrow(px, py, bx, by) }));
    const lines = s("svg", { viewBox: `0 0 ${PIC.width} ${PIC.height}`, class: "pic__lines", "aria-hidden": "true" }, arrows.flatMap((pair) => [pair.in, pair.out]));
    const el = h(`div.pic${hands ? "" : ".pic--plain"}`, { attr: { role: "img" } }, lines, boardName, board, action, people.flatMap((person) => [person.hand, person.el]));

    const fill = (box, texts) => box.replaceChildren(...(texts || []).map((text) => h("span", { text })));
    return {
      el,
      /** state: { value, hands: [text|null ×2], notes: [{ text, tone }|null ×2], move: { lane, op }|null,
          tags: { actors: [], shared: [], action: text }, hot: "actors"|"shared"|"action"|null } */
      set(state) {
        const move = state.move, tags = state.tags || {};
        value.textContent = String(state.value);
        board.classList.toggle("is-now", move?.op === "write" || state.hot === "shared");
        fill(boardTags, tags.shared);
        action.textContent = tags.action || "";
        action.classList.toggle("is-now", state.hot === "action");
        people.forEach((person, i) => {
          const mine = move?.lane === i;
          if (person.hand) {
            const text = state.hands?.[i];
            person.held.textContent = text ?? "";
            person.hand.classList.toggle("is-empty", text === null || text === undefined);
            person.hand.classList.toggle("is-now", mine && (move.op === "read" || move.op === "calc"));
          }
          const note = state.notes?.[i];
          person.note.textContent = note?.text || "";
          person.note.className = `pic__note${note?.tone ? ` pic__note--${note.tone}` : ""}${mine && move.op === "note" ? " is-now" : ""}`;
          person.el.classList.toggle("is-now", state.hot === "actors" || (mine && move.op === "note"));
          fill(person.tags, tags.actors);
          arrows[i].in.classList.toggle("is-on", mine && move.op === "read");
          arrows[i].out.classList.toggle("is-on", (mine && move.op === "write") || Boolean(tags.action));
        });
        const holding = (state.hands || []).map((text, i) => (text === null || text === undefined ? "" : `${actors[i]}手里是 ${text}`)).filter(Boolean).join("，");
        el.setAttribute("aria-label", `${actors.join("和")}共用${shared}，现在是 ${state.value}${holding ? `；${holding}` : ""}`);
      },
    };
  };

  /** What the picture shows after each step of a `lanes` walk: frame 0 is the start, frame k is after step k. */
  L.shareFrames = function (steps, start) {
    const frames = [{ value: start, hands: [null, null], notes: [null, null], move: null }];
    for (const step of steps) {
      const last = frames.at(-1);
      const frame = { value: last.value, hands: [...last.hands], notes: last.notes.map((note) => (note?.tone === "fail" ? null : note)), move: { lane: step.lane, op: step.op } };
      if (step.op === "read") frame.hands[step.lane] = String(frame.value);
      else if (step.op === "calc") frame.hands[step.lane] = step.text.includes("=") ? step.text.split("=").pop().trim() : step.text;
      else if (step.op === "write") { frame.value = step.value; frame.hands[step.lane] = null; }
      else frame.notes[step.lane] = { text: step.text, tone: step.tone };
      frames.push(frame);
    }
    return frames.concat({ ...frames.at(-1), move: null });
  };

  /* ---------- the recorded runs as a line chart ---------- */

  const median = (values) => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
  const VIEW = { width: 640, height: 300, left: 44, right: 178, top: 14, bottom: 34, inset: 18, labelGap: 19 };

  function step(max, ticks = 4) {
    const raw = max / ticks, power = 10 ** Math.floor(Math.log10(raw));
    return [1, 2, 5, 10].find((unit) => unit * power >= raw) * power;
  }

  /** Label heights that keep the order of `wanted` but never sit closer than `gap`, inside [top, bottom]. */
  function spread(wanted, gap, top, bottom) {
    const order = wanted.map((y, i) => ({ y, i })).sort((a, b) => a.y - b.y);
    order.forEach((item, n) => { item.y = Math.max(item.y, n ? order[n - 1].y + gap : top); });
    for (let n = order.length - 1; n >= 0; n--) order[n].y = Math.min(order[n].y, n === order.length - 1 ? bottom : order[n + 1].y - gap);
    const out = [];
    order.forEach((item) => { out[item.i] = item.y; });
    return out;
  }

  L.blocks.chart = (block, ctx) => {
    const exp = ctx.lesson.experiments[block.of];
    const y = { label: "耗时", ...(block.y || exp.time) };
    const xs = exp.knob.values;
    const base = exp.variants[0];
    const series = exp.variants.filter((variant) => !block.show || block.show.includes(variant.id)).slice(0, 4).map((variant) => ({
      variant,
      slot: exp.variants.indexOf(variant) + 1, // colour follows the way of writing, not its place in this chart
      points: xs.map((x) => {
        const runs = exp.results.variants[variant.id].runs[x];
        return { x, value: median(runs.map((run) => run[y.key])), wrong: runs.filter((run) => run[exp.metric.key] !== run[exp.metric.expectKey]).length, total: runs.length };
      }),
    }));
    const tick = step(Math.max(...series.flatMap((one) => one.points.map((point) => point.value))));
    const top = tick * Math.ceil(Math.max(...series.flatMap((one) => one.points.map((point) => point.value))) / tick);
    const plot = { width: VIEW.width - VIEW.left - VIEW.right, height: VIEW.height - VIEW.top - VIEW.bottom };
    const px = (i) => VIEW.left + VIEW.inset + (i * (plot.width - 2 * VIEW.inset)) / (xs.length - 1);
    const py = (value) => VIEW.top + plot.height - (value / top) * plot.height;
    const verdict = (point) => (point.wrong === 0 ? `${point.total} 次全对` : point.wrong === point.total ? `${point.total} 次全错` : `错了 ${point.wrong} 次`);
    let focus = null;

    const grid = [];
    for (let value = 0; value <= top; value += tick) {
      grid.push(s("line", { class: value ? "chart__grid" : "chart__base", x1: VIEW.left, x2: VIEW.left + plot.width, y1: py(value), y2: py(value) }));
      grid.push(s("text", { class: "chart__tick", x: VIEW.left - 8, y: py(value) + 4, "text-anchor": "end" }, String(value)));
    }
    const xLabels = xs.map((x, i) => s("text", { class: "chart__tick", x: px(i), y: VIEW.height - 14, "text-anchor": "middle" }, String(x)));
    const xTitle = s("text", { class: "chart__tick", x: VIEW.left + plot.width + 12, y: VIEW.height - 14 }, exp.knob.label);
    const labelY = spread(series.map((one) => py(one.points.at(-1).value)), VIEW.labelGap, VIEW.top + 6, VIEW.top + plot.height);
    const endX = px(xs.length - 1);

    series.forEach((one, n) => {
      const last = one.points.at(-1);
      one.el = s("g", { class: `chart__series chart__series--${one.slot}` },
        s("polyline", { class: "chart__line", points: one.points.map((point, i) => `${px(i)},${py(point.value)}`).join(" ") }),
        s("polyline", { class: "chart__lead", points: `${endX + 8},${py(last.value)} ${endX + 20},${labelY[n]} ${endX + 30},${labelY[n]}` }),
        one.points.map((point, i) => s("circle", { class: `chart__dot${point.wrong ? " is-wrong" : ""}`, cx: px(i), cy: py(point.value), r: 5 })),
        s("text", { class: "chart__name", x: endX + 35, y: labelY[n] + 4 }, s("tspan", { class: "chart__label" }, `${one.variant.label} `), s("tspan", { class: "chart__end" }, String(last.value))));
    });

    const cross = s("line", { class: "chart__cross", y1: VIEW.top, y2: VIEW.top + plot.height });
    const tip = h("div.chart__tip", { attr: { hidden: "" } });
    function point(i) {
      cross.setAttribute("x1", px(i)); cross.setAttribute("x2", px(i));
      cross.classList.add("is-on");
      tip.replaceChildren(h("b", { text: `${exp.knob.label} ${xs[i]}` }), ...[...series].sort((a, b) => b.points[i].value - a.points[i].value).map((one) => h(`div.chart__row${focus && focus !== one.variant.id ? ".is-dim" : ""}`, null,
        h(`i.chart__key.chart__key--${one.slot}`), h("span", { text: one.variant.label }), h("span.num", { text: `${one.points[i].value} ${y.unit}` }), h(`span${one.points[i].wrong ? ".is-wrong" : ""}`, { text: verdict(one.points[i]) }))));
      tip.hidden = false;
      const half = i >= xs.length / 2;
      tip.style.left = half ? "" : `${((px(i) + 14) / VIEW.width) * 100}%`;
      tip.style.right = half ? `${100 - ((px(i) - 14) / VIEW.width) * 100}%` : "";
    }
    function leave() { cross.classList.remove("is-on"); tip.hidden = true; }
    const width = (plot.width - 2 * VIEW.inset) / (xs.length - 1);
    const hits = xs.map((x, i) => {
      const hit = s("rect", { class: "chart__hit", x: px(i) - width / 2, y: VIEW.top, width, height: plot.height + VIEW.bottom, tabindex: 0, role: "button", "aria-label": `${exp.knob.label} ${x}，读这一列` });
      for (const name of ["pointerenter", "focus", "click"]) hit.addEventListener(name, () => point(i));
      hit.addEventListener("blur", leave);
      return hit;
    });
    const svg = s("svg", { viewBox: `0 0 ${VIEW.width} ${VIEW.height}`, class: "chart__svg", role: "img", "aria-label": `${y.label}随${exp.knob.label}的变化，${series.length} 种写法，数据在下面的表里` },
      grid, xLabels, xTitle, cross, series.map((one) => one.el), hits);
    svg.addEventListener("pointerleave", leave);

    const read = h("p.chart__read", { attr: { "aria-live": "polite" } });
    const buttons = series.map((one) => h("button.chart__pick", { attr: { type: "button", "aria-pressed": "false" }, on: { click: () => look(focus === one.variant.id ? null : one.variant.id) } },
      h(`i.chart__key.chart__key--${one.slot}`), h("span", { text: one.variant.label })));
    function look(id) {
      focus = id;
      series.forEach((one, n) => { one.el.classList.toggle("is-dim", Boolean(id) && one.variant.id !== id); one.el.classList.toggle("is-on", one.variant.id === id); buttons[n].setAttribute("aria-pressed", String(one.variant.id === id)); });
      const one = series.find((candidate) => candidate.variant.id === id);
      if (!one) return read.replaceChildren("点上面的写法名，只看那一条线；把鼠标移到图上（手机上点一下），读那一列的每个数。");
      const last = one.points.at(-1), first = one.points[0];
      const basePoint = exp.results.variants[base.id].runs[last.x];
      const ratio = one.variant.id === base.id ? "" : `，是「${base.label}」的 ${(last.value / median(basePoint.map((run) => run[y.key]))).toFixed(1)} 倍`;
      const wrongAt = one.points.filter((item) => item.wrong).map((item) => item.x);
      read.replaceChildren(L.md(`${one.variant.label}：${exp.knob.label} ${first.x} 时 **${first.value} ${y.unit}**，到 ${last.x} 时 **${last.value} ${y.unit}**${ratio}。${wrongAt.length ? `==${exp.knob.label}为 ${wrongAt.join("、")} 时结果有错==。` : "每一组结果都对。"}`));
    }
    look(null);

    const table = h("details.chart__table", null, h("summary", { text: "看数据表" }), h("table", null,
      h("thead", null, h("tr", null, h("th", { text: `${exp.knob.label} →` }), xs.map((x) => h("th", { text: String(x) })))),
      h("tbody", null, series.map((one) => h("tr", null, h("th", { text: one.variant.label }), one.points.map((item) => h("td", { text: `${item.value} ${y.unit}${item.wrong ? "（有错）" : ""}` })))))));

    return {
      el: h("figure.chart", null,
        h("figcaption.chart__cap", null, h("b", { text: `${y.label}（${y.unit}）` }), h("span", { text: `每个点是 ${exp.repeat} 次真实运行的中位数` }),
          h("span.chart__marks", null, h("i.chart__mark"), "这一组结果全对", h("i.chart__mark.is-wrong"), "有错")),
        h("div.chart__plot", null, svg, tip),
        h("div.chart__side", null, h("div.chart__picks", { attr: { role: "group", "aria-label": "只看一种写法" } }, buttons), read, table)),
      steps: block.walk.map((item) => ({ say: item.say, key: item.key })),
      set(k) { look(k ? block.walk[k - 1].focus : null); },
    };
  };

  /* ---------- the rule for choosing, as a tree ---------- */

  L.blocks.decide = (block) => {
    const branches = block.branches.map((branch) => ({
      pick: branch.pick,
      el: h("li.decide__branch", null,
        h("span.decide__when", null, L.md(branch.when)),
        h("span.decide__pick", null, L.term(branch.pick, h("span", { text: branch.pick }))),
        branch.eg ? h("small.decide__eg", { text: `比如：${branch.eg}` }) : null),
    }));
    /* When the learner answers a `cases` item on the same slide, the branch that item belongs to lights up. */
    const onPicked = (event) => {
      const hit = branches.find((branch) => branch.pick === event.detail.name);
      if (!hit || !hit.el.isConnected) return;
      branches.forEach((branch) => branch.el.classList.remove("is-hit"));
      void hit.el.offsetWidth; // restart the flash when the same branch is hit twice
      hit.el.classList.add("is-hit", "is-used");
    };
    document.addEventListener("lesson:picked", onPicked);
    return { el: h("div.decide", null, h("p.decide__q", null, L.md(block.q)), h("ul.decide__list", null, branches.map((branch) => branch.el))) };
  };
})();

</script>
<script>
/* The experiment block: the code on the left (switch what was changed), what really happened on the right.
   Every dot is one recorded run on the learner's own machine; the page never invents a number. Switching the code or the knob
   moves the same dots, so the learner sees the effect of one change as data. Touch a dot to read that single run. */
(function () {
  "use strict";
  const L = window.Lesson, h = L.h;
  const AXIS_ROOM = 1.04, BIN = 1.2, DROP_MS = 45;
  const still = window.matchMedia("(prefers-reduced-motion: reduce)");

  const median = (values) => { const sorted = [...values].sort((a, b) => a - b); return sorted[Math.floor(sorted.length / 2)]; };

  /** worst: the largest miss of the target, signed (negative = came out too low, positive = too high). */
  function summary(runs, metric) {
    const misses = runs.map((run) => run[metric.key] - run[metric.expectKey]);
    return { wrong: misses.filter(Boolean).length, total: runs.length, worst: misses.reduce((far, miss) => (Math.abs(miss) > Math.abs(far) ? miss : far), 0), expected: runs[0][metric.expectKey] };
  }
  const missed = (miss) => `${miss > 0 ? "多了" : "少了"} ${L.num(Math.abs(miss))}`;

  L.blocks.experiment = (block, ctx) => {
    const exp = ctx.lesson.experiments[block.lab];
    const shown = exp.variants.filter((variant) => block.show.includes(variant.id));
    const base = exp.variants[0];
    const metric = exp.metric, time = exp.time;
    let variant = block.select || shown[0].id;
    let knob = block.at || (exp.knob ? exp.knob.default : "-");
    let played = false;
    let seen = block.hand ? 0 : exp.repeat; // hand: the learner lets the recorded runs out one press at a time

    const runsOf = (id) => exp.results.variants[id].runs[knob];
    const view = L.codeView();
    const note = h("p.exp__note");
    const question = h("p.exp__q");
    const finding = h("p.exp__finding", { attr: { "aria-live": "polite" } });
    const probe = h("span.exp__probe");
    const command = h("code.cmd");
    const ticks = h("div.plot__ticks", null, h("span", { text: "0" }), h("span.is-expect"));

    const rows = shown.map((item) => {
      const dots = Array.from({ length: exp.repeat }, (unused, i) => h("i.dot.is-waiting", { on: { mouseenter: () => read(item, i), click: () => read(item, i) } }));
      const sum = h("span.plot__sum");
      const label = h("button.plot__label", { text: item.label, attr: { type: "button" }, on: { click: () => choose(item.id) } });
      return { item, dots, sum, track: h("div.plot__track", null, dots), el: null, label };
    });
    rows.forEach((row) => { row.el = h("div.plot__row", null, row.label, row.track, row.sum); });

    function read(item, i) {
      const run = runsOf(item.id)[i];
      probe.textContent = `${item.label} · 第 ${i + 1} 次：${metric.key} = ${L.num(run[metric.key])}${time ? `，${run[time.key]} ${time.unit}` : ""}`;
    }

    /* The far end of the axis: the largest result or target among everything this block can show. */
    const reachable = exp.knob && block.knob !== false ? exp.knob.values : [knob];
    const axisTop = AXIS_ROOM * Math.max(...shown.flatMap((item) => reachable.flatMap((value) => exp.results.variants[item.id].runs[value].flatMap((run) => [run[metric.key], run[metric.expectKey]]))));

    function place(row) {
      const runs = runsOf(row.item.id);
      const info = summary(runs, metric);
      const bins = new Map();
      row.track.style.setProperty("--expect", `${(info.expected / axisTop) * 100}%`);
      runs.forEach((run, i) => {
        const percent = (run[metric.key] / axisTop) * 100;
        const bin = Math.round(percent / BIN);
        const seat = bins.get(bin) || 0;
        bins.set(bin, seat + 1);
        row.dots[i].style.left = `${percent}%`;
        row.dots[i].style.transform = `translate(${-Math.floor(seat / 3) * 7}px, ${[0, -11, 11][seat % 3]}px)`;
        row.dots[i].classList.toggle("is-ok", run[metric.key] === run[metric.expectKey]);
      });
      row.sum.replaceChildren(
        h(`b${info.wrong ? "" : ".is-ok"}`, { text: info.wrong === 0 ? `${info.total} 次全对` : info.wrong === info.total ? `${info.total} 次全错` : `错了 ${info.wrong} 次` }),
        time ? h("span.num", { text: `中位 ${median(runs.map((run) => run[time.key]))} ${time.unit}` }) : null,
      );
      row.el.classList.toggle("is-on", row.item.id === variant);
      return info;
    }

    function tell(info, item) {
      const runs = runsOf(item.id);
      const speed = time ? `中位耗时 **${median(runs.map((run) => run[time.key]))} ${time.unit}**` : "";
      if (info.wrong === 0) {
        const slower = time && item.id !== base.id ? `，${base.label}是 ${median(runsOf(base.id).map((run) => run[time.key]))} ${time.unit}` : "";
        return `${item.label}：${info.total} 次==全对==。${speed}${slower}。`;
      }
      const share = Math.round((Math.abs(info.worst) / info.expected) * 100);
      return `${item.label}：${info.total} 次里 ==${info.wrong} 次不对==。${info.worst > 0 ? "最多到了" : "最少只到"} **${L.num(info.expected + info.worst)}**，${missed(info.worst)}${share ? `（${share}%）` : ""}。${speed}。`;
    }

    function draw() {
      const item = exp.variants.find((candidate) => candidate.id === variant);
      const source = exp.sources[variant];
      view.show(source, { path: exp.paths[variant], lang: exp.lang, changed: variant === base.id ? [] : L.changedLines(exp.sources[base.id], source), focus: variant === base.id ? block.focusLines || [] : [] });
      note.textContent = item.note || "";
      let info = null;
      for (const row of rows) { const result = place(row); if (row.item.id === variant) info = result; }
      ticks.style.setProperty("--expect", `${(info.expected / axisTop) * 100}%`);
      ticks.lastChild.textContent = `应该是 ${L.num(info.expected)}`;
      question.replaceChildren(L.md(`每种写法跑 **${exp.repeat} 次**，一个点是一次的「${metric.label}」。`));
      finding.replaceChildren(L.md(tell(info, item)));
      command.textContent = `${exp.shown[variant]}${knob === "-" ? "" : ` ${knob}`}`;
      probe.textContent = "";
      if (block.hand) paintHand();
    }

    /* Hand mode: nothing is summed up until every run has been seen, so the surprise is the learner's own. */
    const more = h("button.btn.btn--primary", { attr: { type: "button" }, on: { click: () => letOut(1) } });
    const rest = h("button.btn", { attr: { type: "button" }, on: { click: () => letOut(exp.repeat) } });
    const hand = block.hand ? h("div.exp__hand", null, more, rest) : null;
    function paintHand() {
      const row = rows[0], runs = runsOf(row.item.id), pending = seen < exp.repeat;
      row.dots.forEach((dot, i) => dot.classList.toggle("is-waiting", i >= seen));
      row.sum.classList.toggle("is-held", pending);
      hand.hidden = !pending;
      if (!pending) return;
      more.textContent = seen === 0 ? "看第 1 次运行" : "再看一次";
      rest.textContent = `把剩下的 ${exp.repeat - seen} 次一起放出来`;
      rest.hidden = seen < 2;
      if (seen === 0) return finding.replaceChildren("还一次都没看。点下面的按钮，看第 1 次跑出了多少。");
      const last = runs[seen - 1], value = last[metric.key], expected = last[metric.expectKey];
      const same = seen > 1 && runs[seen - 2][metric.key] === value;
      finding.replaceChildren(L.md(`第 ${seen} 次：**${L.num(value)}**。${value === expected ? "和应该的一样。" : `应该是 ${L.num(expected)}，==${missed(value - expected)}==。`}${seen > 1 ? (same ? "和上一次一样。" : "和上一次还不一样。") : ""}`));
    }
    function letOut(n) {
      const from = seen;
      seen = Math.min(exp.repeat, seen + n);
      draw();
      if (seen - from > 1 && !still.matches) rows[0].dots.forEach((dot, i) => { if (i >= from) { dot.classList.add("is-waiting"); setTimeout(() => dot.classList.remove("is-waiting"), 80 + (i - from) * DROP_MS); } });
    }

    function play() {
      played = true;
      if (seen < exp.repeat) return;
      const all = rows.flatMap((row) => row.dots);
      all.forEach((dot) => dot.classList.add("is-waiting"));
      if (still.matches) return all.forEach((dot) => dot.classList.remove("is-waiting"));
      rows.forEach((row) => row.dots.forEach((dot, i) => setTimeout(() => dot.classList.remove("is-waiting"), 260 + i * DROP_MS)));
    }

    function choose(id) { variant = id; tabs?.pick(id); draw(); }
    const tabs = shown.length > 1 ? L.segmented("写法", shown.map((item) => ({ id: item.id, label: item.label })), variant, choose) : null;
    const dial = exp.knob && block.knob !== false ? L.segmented(exp.knob.label, exp.knob.values.map((value) => ({ id: value, label: value })), knob, (value) => { knob = value; draw(); }) : null;
    const copy = h("button.btn.btn--quiet", { text: "复制", attr: { type: "button" }, on: { click() { navigator.clipboard?.writeText(command.textContent).then(() => { copy.textContent = "已复制"; }, () => {}); } } });
    const env = exp.results.env;

    draw();
    return {
      el: h("div.exp", null,
        tabs || dial ? h("div.exp__bar", null, tabs?.el, dial?.el) : null,
        h("div.exp__body", null,
          h("div", null, view.el, note),
          h("div.exp__data", null, question, h("div.plot", null, rows.map((row) => row.el), h("div.plot__axis", null, h("span"), ticks, h("span"))), finding, hand,
            h("div.exp__foot", null,
              h("span", { text: `真实记录 · 这台电脑 · ${env.runtime} · ${env.cores} 个逻辑核 · ${env.date}` }),
              h("button.btn.btn--quiet", { text: "再放一遍", attr: { type: "button" }, on: { click: play } }),
              h("span", null, "自己跑：", command), copy, probe))),
      ),
      refresh() { if (!played) play(); },
      waitSay: "先自己看：点「看第 1 次运行」，一次一次把结果放出来。实在想跳过，再按一次。",
      ready: () => seen >= exp.repeat,
      pass() { if (seen < exp.repeat) letOut(exp.repeat); },
    };
  };
})();

</script>
<script>
/* Two actors and the one thing they share, with time running downward.
   `lanes` is the teacher's walk through one fixed order of steps; a step may end in a question the learner answers before the next
   step shows what really happens. `schedule` hands the order to the learner: they press which actor moves next and watch what the
   shared value becomes, with a lock they can switch on. Both draw rows the same way. */
(function () {
  "use strict";
  const L = window.Lesson, h = L.h;
  const OPS = ["read", "calc", "write"];

  /** One row: a step in its actor's lane, an arrow to or from the shared value when the step touches it.
      A `note` step touches nothing: the actor waits, gives up, takes or releases something. */
  function row(step, shared) {
    const touches = step.op === "read" || step.op === "write";
    const inward = step.op === "write";
    const arrow = h(`span.arrow.arrow--${!touches ? "none" : (step.lane === 0) === inward ? "right" : "left"}`);
    const chip = h(`span.chip${step.op === "note" && step.tone ? `.chip--${step.tone}` : ""}`, { text: step.text });
    const cells = [h("div.lcell.lcell--a"), h("div.lcell.lcell--mid"), h("div.lcell.lcell--b")];
    cells[step.lane === 0 ? 0 : 2].append(...(step.lane === 0 ? [chip, arrow] : [arrow, chip]));
    if (touches) cells[1].append(h(`span.val${inward ? ".val--write" : ""}`, { text: String(shared) }));
    return h("div.lrow", null, cells);
  }

  function grid(names, sharedName, rows) {
    return h("div.lanes__grid", null,
      h("div.lanes__head.lanes__head--a", { text: names[0] }), h("div.lanes__head.lanes__head--mid", { text: sharedName }), h("div.lanes__head.lanes__head--b", { text: names[1] }),
      rows);
  }

  L.blocks.lanes = (block, ctx) => {
    let shared = block.shared.start, now = 0;
    const key = `lanes:${block.expr}:${block.steps.length}`;
    const answers = ctx.memory.get(key, {});
    const parts = OPS.map((op) => h("span.part", { text: block.parts[op] }));
    const rows = block.steps.map((step) => { if (step.op === "write") shared = step.value; return row(step, shared); });
    const verdict = h("p.lanes__verdict.is-waiting", null, L.md(block.verdict));
    const askBox = h("div.lanes__ask", { attr: { hidden: "" } });
    const askNow = () => (now >= 1 && now <= rows.length ? block.steps[now - 1].ask : null);
    /* The same steps seen in space: who holds what, and what the shared thing is right now. */
    const picture = L.sharePicture({ actors: block.lanes, shared: block.shared.name });
    const frames = L.shareFrames(block.steps, block.shared.start);

    /* The question that closes a step: what will the next step do? Answered here, shown for real by the next press. */
    function paintAsk() {
      const ask = askNow();
      askBox.hidden = !ask;
      if (!ask) return;
      const picked = answers[now - 1];
      const buttons = ask.options.map((text, i) => {
        const button = h("button.pick", { attr: { type: "button" }, on: { click() { answers[now - 1] = i; ctx.memory.set(key, answers); paintAsk(); } } }, L.md(text));
        button.disabled = picked !== undefined;
        if (picked !== undefined && i === ask.answer) button.classList.add("is-right");
        if (picked === i && i !== ask.answer) button.classList.add("is-wrong");
        return button;
      });
      const out = picked === undefined ? "" : picked === ask.answer ? "对。按下一步，看它是怎么发生的。" : "不是这个。按下一步，看实际发生了什么。";
      askBox.replaceChildren(h("p", null, L.md(ask.q)), h("div.picks", null, buttons), h("p.ask__out", { text: out }));
    }

    return {
      el: h(`div.lanes${rows.length > 7 ? ".lanes--long" : ""}`, null,
        h("div.lanes__main", null,
          h("div.lanes__expr", null, h("code.lanes__code", { text: block.expr }), h("div.lanes__parts", null, parts[0], "→", parts[1], "→", parts[2])),
          grid(block.lanes, block.shared.name, rows), askBox, verdict),
        h("div.lanes__side", null, h("p.lanes__now", { text: "此刻" }), picture.el)),
      steps: block.steps.map((step) => ({ say: step.say, key: step.key })).concat({ say: block.verdictSay, key: block.verdictKey }),
      waitSay: "先猜一下再往下：点一个你觉得会发生的。实在想跳过，再按一次。",
      ready: () => !askNow() || answers[now - 1] !== undefined,
      set(k) {
        now = k;
        rows.forEach((el, i) => { el.classList.toggle("is-waiting", i >= k); el.classList.toggle("is-now", i === k - 1); });
        const op = k >= 1 && k <= rows.length ? block.steps[k - 1].op : null;
        parts.forEach((part, i) => part.classList.toggle("is-now", OPS[i] === op));
        verdict.classList.toggle("is-waiting", k <= rows.length);
        picture.set(frames[Math.min(k, frames.length - 1)]);
        paintAsk();
      },
      /** The part that just changed, so a long walk keeps its newest row on screen. */
      spot: () => (now > rows.length ? verdict : askNow() ? askBox : rows[now - 1]?.firstChild),
    };
  };

  L.blocks.schedule = (block) => {
    const name = block.shared.name;
    const hint = { read: `读 ${name}`, calc: "算出新值", write: `写回 ${name}` };
    const reached = new Set();
    let shared, actors, owner, locked = false;

    const rows = h("div.lrow-list");
    const value = h("span.val");
    const buttons = [0, 1].map((lane) => h("button.btn", { attr: { type: "button" }, on: { click: () => move(lane) } }));
    const result = h("p.sched__result", { attr: { "aria-live": "polite" } });
    const goals = block.goals.map((goal) => h("li.goal", { text: goal.label }));
    const lock = block.lock ? L.segmented("", [{ id: "off", label: "不加锁" }, { id: "on", label: block.lock.label }], "off", (id) => { locked = id === "on"; reset(); }) : null;
    const allReached = () => block.goals.every((goal) => reached.has(goal.value));

    function paint() {
      value.textContent = String(shared);
      buttons.forEach((button, lane) => {
        const actor = actors[lane];
        const waits = locked && owner !== null && owner !== lane;
        button.disabled = actor.pc === OPS.length || waits;
        button.textContent = actor.pc === OPS.length ? `${block.lanes[lane]} 走完了` : waits ? `${block.lanes[lane]} 在等锁` : `${block.lanes[lane]} 走一步：${hint[OPS[actor.pc]]}`;
      });
      goals.forEach((el, i) => el.classList.toggle("is-done", reached.has(block.goals[i].value)));
      if (actors.some((actor) => actor.pc < OPS.length)) { result.textContent = ""; return; }
      reached.add(shared);
      goals.forEach((el, i) => el.classList.toggle("is-done", reached.has(block.goals[i].value)));
      const lost = (block.shared.start + 2 * block.delta - shared) / block.delta;
      const outcome = `两边都走完了：${name} = ${shared}。${lost ? `有 ${lost} 次白加了。` : "一次都没丢。"}`;
      result.replaceChildren(L.md(allReached() ? `${outcome}${block.done}` : `${outcome}点「重来」，换一种顺序试试。`));
    }

    function move(lane) {
      const actor = actors[lane], op = OPS[actor.pc];
      let text;
      if (op === "read") { actor.local = shared; owner = lane; text = `读到 ${shared}`; }
      else if (op === "calc") { text = `${actor.local} ${block.delta < 0 ? "−" : "+"} ${Math.abs(block.delta)} = ${actor.local + block.delta}`; actor.local += block.delta; }
      else { shared = actor.local; owner = null; text = `写回 ${shared}`; }
      actor.pc += 1;
      rows.append(row({ lane, op, text }, shared));
      rows.lastChild.scrollIntoView({ block: "nearest" });
      paint();
    }

    function reset() {
      shared = block.shared.start;
      actors = [{ pc: 0, local: null }, { pc: 0, local: null }];
      owner = null;
      rows.replaceChildren();
      paint();
    }

    reset();
    return {
      el: h("div.sched", null,
        h("div.sched__bar", null, h("ul.goals", null, goals), lock?.el, h("button.btn.btn--quiet", { text: "重来", attr: { type: "button" }, on: { click: reset } })),
        grid(block.lanes, name, [rows,
          h("div.lrow.lrow--controls", null, h("div.lcell.lcell--a", null, buttons[0]), h("div.lcell.lcell--mid", null, value), h("div.lcell.lcell--b", null, buttons[1]))]),
        result),
      waitSay: "先自己排一排：点两边的按钮，把上面几种结果都排出来。实在想跳过，再按一次。",
      ready: allReached,
    };
  };
})();

</script>
<script>
/* The lesson as a sequence of moments. A moment is one teacher sentence plus one visible change: a block appearing, or one step
   inside a block. → / space goes to the next moment, ← back; the track at the top shows where the lesson is in its arc.
   A block that waits for the learner (a guess, a quiz) holds the lesson once, then lets a second press pass.
   Deep link: #4 opens slide 4, #4.end opens it with every moment shown. */
(function () {
  "use strict";
  const L = window.Lesson, h = L.h;
  const lesson = JSON.parse(document.getElementById("lesson-data").textContent);
  const memory = L.memory(`lesson:${lesson.id}`);
  const predicts = {};
  for (const slide of lesson.slides) for (const block of slide.blocks) if (block.t === "predict") predicts[block.id] = block;
  const ctx = { lesson, memory, predicts };
  L.glossary = lesson.terms || {};

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), line = $("line"), keyLine = $("key"), prev = $("prev"), next = $("next"), count = $("count"), notes = $("notes"), notesList = $("notes-list");
  const beats = lesson.beats.map((beat) => h("button.beat", { text: beat.label, attr: { type: "button" }, on: { click: () => go(lesson.slides.findIndex((slide) => slide.beat === beat.id), 0) } }));
  $("beats").append(...beats);
  $("title").textContent = `${lesson.course} · ${lesson.title}`;

  let at = { s: 0, m: 0 }, current = null, nudged = false;

  function build(index) {
    const slide = lesson.slides[index];
    const items = slide.blocks.map((block) => { const made = L.blocks[block.t](block, ctx); return { block, made, wrap: h("div.block.is-waiting", null, made.el), seen: false }; });
    const moments = slide.bridge ? [{ b: -1, k: 0, say: slide.bridge }] : [];
    items.forEach((item, b) => {
      moments.push({ b, k: 0, say: item.block.say, key: item.block.key });
      (item.made.steps || []).forEach((step, i) => moments.push({ b, k: i + 1, say: step.say ?? step, key: step.key }));
    });
    const hook = index === 0;
    const meta = hook ? h("div.hook__meta", null,
      h("div", null, h("h3", { text: "需要先会" }), h("ul", null, lesson.needs.map((item) => h("li", { text: item })))),
      h("div", null, h("h3", { text: `学完你能（约 ${lesson.minutes} 分钟）` }), h("ul", null, lesson.after.map((item) => h("li", { text: item }))))) : null;
    const el = h(`section.slide${hook ? ".slide--hook" : ""}${slide.layout === "split" ? ".slide--split" : ""}`, null,
      h("h1.slide__title", { text: slide.title }), h("div.slide__blocks", null, items.map((item) => item.wrap)), meta);
    return { index, items, moments, el };
  }

  function remember(key) {
    const keys = memory.get("keys", []);
    if (keys.includes(key)) return;
    memory.set("keys", keys.concat(key));
    notes.classList.remove("is-flash");
    void notes.offsetWidth;
    notes.classList.add("is-flash");
  }

  function paintNotes() {
    const keys = memory.get("keys", []);
    notes.textContent = `要点 ${keys.length}`;
    notesList.replaceChildren(...(keys.length ? keys.map((key) => h("li", { text: key })) : [h("li.is-empty", { text: "讲到关键结论时，会自动记在这里。" })]));
  }

  function show(spoken) {
    L.hideTip();
    if (!current || current.index !== at.s) { current = build(at.s); stage.replaceChildren(current.el); stage.scrollTop = 0; }
    at.m = Math.min(at.m, current.moments.length - 1);
    const now = current.moments[at.m];
    current.items.forEach((item, b) => {
      const reached = current.moments.filter((moment, i) => i <= at.m && moment.b === b);
      item.wrap.classList.toggle("is-waiting", reached.length === 0);
      if (!reached.length) { item.seen = false; return; }
      item.made.set?.(reached.at(-1).k);
      if (!item.seen) { item.seen = true; item.made.refresh?.(); }
    });
    line.replaceChildren(h("span", null, L.md(spoken || now.say)));
    line.classList.remove("is-fresh");
    void line.offsetWidth;
    line.classList.add("is-fresh");
    keyLine.hidden = !now.key || Boolean(spoken);
    if (now.key && !spoken) { keyLine.textContent = `已记入要点：${now.key}`; remember(now.key); }
    paintNotes();
    // keep what just changed in view: the block says which part of it that is, or it is the block itself
    const changed = current.items[now.b];
    if (at.m > 0 && changed) (changed.made.spot?.() || changed.wrap).scrollIntoView({ block: "nearest", behavior: "smooth" });
    const beat = lesson.beats.findIndex((item) => item.id === lesson.slides[at.s].beat);
    beats.forEach((el, i) => { el.classList.toggle("is-now", i === beat); el.classList.toggle("is-done", i < beat); el.setAttribute("aria-current", i === beat ? "step" : "false"); });
    count.textContent = `${at.s + 1} / ${lesson.slides.length}`;
    const last = at.s === lesson.slides.length - 1 && at.m === current.moments.length - 1;
    prev.disabled = at.s === 0 && at.m === 0;
    next.disabled = last;
    memory.set("at", at);
  }

  function go(s, m) { if (s < 0) return; at = { s, m }; nudged = false; show(); }

  function forward() {
    const item = current.items[current.moments[at.m].b];
    if (item?.made.ready && !item.made.ready()) {
      if (!nudged) { nudged = true; return show(item.made.waitSay || "先选一个再往下。猜错没关系；实在想跳过，再按一次。"); }
      item.made.pass?.(); // the learner chose to skip: the block shows what it was holding back
    }
    if (at.m < current.moments.length - 1) return go(at.s, at.m + 1);
    if (at.s < lesson.slides.length - 1) go(at.s + 1, 0);
  }

  function back() {
    if (at.m > 0) return go(at.s, at.m - 1);
    if (at.s > 0) go(at.s - 1, Number.MAX_SAFE_INTEGER);
  }

  next.addEventListener("click", forward);
  prev.addEventListener("click", back);
  document.addEventListener("keydown", (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    const typing = event.target.closest?.("button, input, [role=button], .code__scroll");
    if (event.key === "ArrowRight" || event.key === "PageDown" || (event.key === " " && !typing)) { event.preventDefault(); forward(); }
    else if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); back(); }
  });

  notes.addEventListener("click", (event) => { event.stopPropagation(); notesList.hidden = !notesList.hidden; });
  document.addEventListener("click", (event) => { if (!notesList.contains(event.target)) notesList.hidden = true; });

  const root = document.documentElement, themeButton = $("theme");
  const dark = () => (root.dataset.theme ? root.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches);
  const paintTheme = () => { themeButton.textContent = dark() ? "浅色" : "深色"; };
  themeButton.addEventListener("click", () => { root.dataset.theme = dark() ? "light" : "dark"; try { localStorage.setItem("lesson-theme", root.dataset.theme); } catch { /* private window */ } paintTheme(); });
  paintTheme();

  const link = /^#(\d+)(\.end)?$/.exec(location.hash);
  const saved = memory.get("at", { s: 0, m: 0 });
  if (link) go(Math.min(Number(link[1]), lesson.slides.length) - 1, link[2] ? Number.MAX_SAFE_INTEGER : 0);
  else go(Math.min(saved.s, lesson.slides.length - 1), saved.m);
})();

</script>
