  <script>

      --surface: #faf8f4;

      --ink: #1e1a15;
      --ink-2: #453e35;

      --ok: #1c6c48;
      --ok-wash: #1c6c4818;

        --canvas: #161412;
        --surface: #1e1b18;
        --raised: #26231f;
        --sunken: #110f0d;
        --ink: #efe9df;
        --ink-2: #c5bdb1;
        --muted: #a59d91;
        --faint: #958e84;
        --rule: #fff1dc21;
        --rule-strong: #fff1dc4d;
        --accent: #d8492c;
        --accent-text: #ec6a4a;
        --accent-wash: #ec6a4a1f;
        --ok: #62c092;
        --ok-wash: #62c09224;
        --warn: #e5a952;
        --warn-wash: #e5a95224;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --canvas: #161412;
      --surface: #1e1b18;
      --raised: #26231f;
      --sunken: #110f0d;
      --ink: #efe9df;
      --ink-2: #c5bdb1;
      --muted: #a59d91;
      --faint: #958e84;
      --rule: #fff1dc21;
      --rule-strong: #fff1dc4d;
      --accent: #d8492c;
      --accent-text: #ec6a4a;
      --accent-wash: #ec6a4a1f;
      --ok: #62c092;
      --ok-wash: #62c09224;
      --warn: #e5a952;
      --warn-wash: #e5a95224;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.6;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }
    .brand h1 {
      font-size: 1.12rem;
      margin: 0;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.88rem;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--rule-strong);
      background: var(--raised);
      color: var(--ink);
      padding: 0.42rem 0.8rem;
      border-radius: 6px;
      font-size: 0.86rem;
      transition: background 0.15s, border-color 0.15s;

    button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .progress-pill {
      background: var(--ok-wash);
      color: var(--ok);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.84rem;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 3rem;
    }

    /* Simulator Panel */
    .sim-box {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1.5rem;
    }
    .sim-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }
    .sim-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }
    .sim-scenarios {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }
    .sim-scenarios button.active {
      background: var(--accent-wash);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }
    .pipeline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.6rem;
      margin-bottom: 0.85rem;
    }
    .pipe-step {
      background: var(--raised);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }
    .pipe-step:hover { transform: translateY(-1px); border-color: var(--accent); }
    .pipe-step.pass { border-left: 4px solid var(--ok); }
    .pipe-step.block { border-left: 4px solid var(--accent); background: var(--accent-wash); }
    .pipe-step.skip { opacity: 0.48; border-style: dashed; }
    .pipe-step .step-num { font-family: var(--mono); font-size: 0.74rem; color: var(--muted); }
    .pipe-step .step-name { font-weight: 700; margin: 0.15rem 0; }
    .pipe-step .step-tag { font-size: 0.75rem; color: var(--ink-2); }
    .sim-log {
      background: var(--sunken);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      color: var(--ink);
      border-left: 3px solid var(--accent);
    }

    /* Main Grid */
    .workspace {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .sidebar {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 0.9rem;
      max-height: 78vh;
      overflow-y: auto;
      position: sticky;
      top: 4.6rem;
    }
    .filter-tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .filter-tabs button {
      flex: 1;
      padding: 0.32rem 0.4rem;
      font-size: 0.78rem;
    }
    .filter-tabs button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .lesson-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.52rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      border: 1px solid transparent;
    }
    .lesson-item:hover { background: var(--sunken); }
    .lesson-item.active {
      background: var(--accent-wash);
      border-color: var(--accent);
      font-weight: 600;
    }
    .lesson-num {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--muted);
      min-width: 24px;
    }
    .done-dot {
      color: var(--ok);
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* Lesson Detail Card */
    .lesson-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 1.5rem 1.75rem;
    }
    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
    }
    .lesson-title {
      margin: 0.25rem 0 0;
      font-size: 1.35rem;
    }
    .foundation-tag {
      font-family: var(--mono);
      font-size: 0.78rem;
      background: var(--sunken);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      color: var(--ink-2);
    }

    .section-block {
      background: var(--raised);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 1.1rem;
    }
    .section-block h3 {
      margin: 0 0 0.65rem;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .quiz-opt {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 0.45rem;
      padding: 0.6rem 0.85rem;
      font-size: 0.9rem;
      background: var(--surface);
    }
    .quiz-opt.correct {
      border-color: var(--ok);
      background: var(--ok-wash);
      font-weight: 600;
    }
    .quiz-opt.wrong {
      border-color: var(--accent);
      background: var(--accent-wash);
    }
    .quiz-feedback {
      margin-top: 0.6rem;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.88rem;
      display: none;
    }

    .code-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    @media (max-width: 820px) {
      .code-grid { grid-template-columns: 1fr; }
    }
    .code-pane {
      background: var(--sunken);
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
      overflow-x: auto;
    }
    .code-pane .pane-label {
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 0.45rem;
    }
    .code-pane.bad .pane-label { color: var(--accent-text); }
    .code-pane.good .pane-label { color: var(--ok); }
    pre {
      margin: 0;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    code.inline {
      font-family: var(--mono);
      background: var(--sunken);
      padding: 0.1rem 0.38rem;
      border-radius: 4px;
      font-size: 0.84em;
    }

    .mission-box {
      background: var(--warn-wash);
      border-left: 4px solid var(--warn);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .timer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.65rem;
    }
    .clock {
      font-family: var(--mono);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-text);
      min-width: 68px;
    }
    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
    }
  </style>
</head>

<header>
  <div class="brand">
    <span class="badge">MODULE 07</span>
    <h1>双实战项目 · 20 节掀机盖拆解工作台</h1>
  </div>
  <div class="top-actions">
    <span class="progress-pill" id="progressText">已吃透 0 / 20 节</span>
    <a href="../index.html" style="color:var(--accent-text);text-decoration:none;font-weight:600;">← 返回实验课总导航</a>
    <button id="themeBtn" type="button">切换亮/暗主题</button>

</header>

<div class="container">
  <!-- Interactive Pipeline Simulator -->
  <section class="sim-box">
    <div class="sim-header">
      <h2>机盖透视模拟器：亲眼看一次请求在项目 A / 项目 B 里穿过了哪些层</h2>
      <div>
        <button id="simModeA" class="primary" type="button">项目 A：RBAC 后台洋葱圈</button>
        <button id="simModeB" type="button">项目 B：秒杀五道防线</button>

</div>

<script>
const SIM_DATA = {
  A: {
    steps: [
      { name: "Tomcat 线程池", tag: "复用 Worker 线程" },
      { name: "TraceIdFilter", tag: "MDC 绑定 & finally 清理" },
      { name: "JwtAuthFilter", tag: "验签 + 查 type=ACCESS + 查黑名单" },
      { name: "@PreAuthorize", tag: "AOP 核对 user:write" },
      { name: "AuditLogAspect", tag: "计时 + REQUIRES_NEW 保日志" },
      { name: "@Transactional", tag: "借 Hikari 连接关自动提交" },
      { name: "JPA / InnoDB", tag: "LAZY + @BatchSize 执行 SQL" }
    ],
    scenarios: [
      {
        label: "① admin 正常创建用户",
        states: ["pass", "pass", "pass", "pass", "pass", "pass", "pass"],
        explain: "【全链路绿灯】Tomcat 借出线程 → TraceIdFilter 写入 X-Trace-Id → JwtAuthFilter 验过 ACCESS Token 写入 SecurityContextHolder → @PreAuthorize 放行 → AuditLogAspect 开始计时 → UserService 开启事务插入 sys_user → REQUIRES_NEW 提交 success=true 审计日志 → finally 清空 MDC 归还线程。"
      },
      {
        label: "② 拿 7 天 Refresh Token 冒充访问",
        states: ["pass", "pass", "block", "skip", "skip", "skip", "skip"],
        explain: "【第 3 层当场拦截】虽然 Refresh Token 的 HMAC 签名也是真的，但 JwtService.parseAndValidate 强校验 payload.type == 'ACCESS'，发现是 REFRESH 立即抛异常清空上下文，后续请求未认证返回 401（对应 FoundationPitfallDrillsTest#drill02）。"
      },
      {
        label: "③ viewer 只读账号尝试删改用户",
        states: ["pass", "pass", "pass", "block", "skip", "skip", "skip"],
        explain: "【第 4 层权限拦截】viewer 身份合法（过了第 3 层，所以不是 401），但权限集合只有 ['ROLE_VIEWER', 'user:read']，在 Controller 代理层被 @PreAuthorize('hasAuthority(\"user:write\")') 拦下抛 AccessDeniedException 返回 403。"
      },
      {
        label: "④ 创建重名用户触发事务回滚",
        states: ["pass", "pass", "pass", "pass", "pass", "block", "block"],
        explain: "【第 5 层独立保住案发现场！】业务事务抛 BizException(40901) 回滚了半截写入；但 AuditLogAspect 的 finally 调了独立 Bean AuditLogPersistenceService(REQUIRES_NEW)，挂起脏事务新开连接把 success=false 和报错原因落盘提交！（对应 #drill04）"
      }
    ]
  },
  B: {
    steps: [
      { name: "详情 SingleFlight", tag: "合并冷读 + 空哨兵" },
      { name: "16 分片 CAS / Lua", tag: "按人限领 + 顺延扣桶" },
      { name: "有界 MDC 线程池", tag: "ArrayBlockingQueue 反压" },
      { name: "同事务 Outbox", tag: "扣库 + 订单 + 本地消息表" },
      { name: "中继 + 幂等发券", tag: "uk_coupon_order_no 兜底" },
      { name: "CAS 状态机", tag: "casWon==1 + afterCommit 回补" }
    ],
    scenarios: [
      {
        label: "① 正常抢券到发券闭环",
        states: ["pass", "pass", "pass", "pass", "pass", "pass"],
        explain: "【50,000+ req/s 主干道】16 分片桶原子预扣并记下 userId → 拍下主线程 MDC(traceId) 快照投递进有界队列，立即返回 HTTP 202 → 异步线程同事务写订单与 tx_outbox → 中继器投递事件 → CouponFulfillmentConsumer 幂等发券。"
      },
      {
        label: "② 同一买家连点两下抢券",
        states: ["pass", "block", "skip", "skip", "skip", "skip"],
        explain: "【第 2 道防线微秒级拦截】claimedUsers.add(userId) 或 Redis Lua SISMEMBER 发现该用户已占坑，连分片桶和线程池都不碰，直接返回 409 ALREADY_CLAIMED，数据库零压力。"
      },
      {
        label: "③ 突发洪峰塞满异步队列",
        states: ["pass", "pass", "block", "skip", "skip", "skip"],
        explain: "【第 3 道防线反压零漏单】ArrayBlockingQueue 满槽触发 RejectedExecutionException → catch 块当场执行 preDeductEngine.rollback() 把刚扣的 1 个分片库存和限购名额原路退回 → 返回 429 提示稍后重试，绝不静默少卖（对应 #drill05）。"
      },
      {
        label: "④ 16 线程并发超时关单回补库存",
        states: ["skip", "skip", "skip", "pass", "skip", "pass"],
        explain: "【第 6 道防线防超卖闭环】16 个线程同时执行 WHERE order_no=? AND status='PENDING'，InnoDB 行锁保证只有 1 个线程拿到 casWon==1 并给 DB 库存 +1，且等 DB 事务 afterCommit 后才往分片池加回 1 张票，绝不多补（对应 #drill02）。"
      }
    ]
  }
};

const LESSONS = [
  {
    num: "01", proj: "A", title: "Maven 脚手架、Profile 隔离与关掉 OSIV",
    foundation: "HikariCP 连接生命周期 · Spring Profile 配置覆盖",
    quiz: {
      q: "如果保留 Spring Boot 默认的 spring.jpa.open-in-view: true，高并发下最致命的副作用是什么？",
      opts: [

        "数据库连接在 @Transactional 结束后仍不归还，直到整个 HTTP 响应序列化写出完毕才释放，极易耗尽连接池",
        "会导致二级缓存自动失效"
      ],
      ans: 1,
      why: "OSIV 把 Hibernate Session 绑在整个请求视图阶段，哪怕 Controller 后面在做慢速网络/序列化，JDBC 连接也一直被霸占。"
    },
    badCode: `# 新手默认配置（隐患）\nspring:\n  datasource:\n    password: myProdPassword123 # 硬编码上 Git\n  jpa:\n    open-in-view: true # 连接占到 HTTP 结束`,
    goodCode: `# application.yml + application-mysql.yml\nspring:\n  jpa:\n    open-in-view: false # 离开 @Transactional 立即归还连接\n# 生产密码走环境变量 \${MYSQL_PASSWORD}`,
    hood: "数据库连接池（HikariCP 默认仅 10 条连接）是全站最昂贵的稀缺资源。关掉 OSIV 逼着我们在 Service 层事务内干净地完成数据查询并组装成不可变 Record VO，绝不把持久化实体泄露到视图层。",
    mission: "打开 projects/project-a-admin/src/main/resources/application.yml 核对 open-in-view: false，再对比 application-mysql.yml 的环境变量占位符。",
    sayPrompt: "请用 2 分钟向面试官解释：什么是 Open-Session-In-View？为什么你们项目强制把它设成 false？关掉之后怎么避免 LazyInitializationException？",
    sayPoints: ["HikariCP 默认连接数少（如 10 个），OSIV 会把连接占用时间从几毫秒拉长到整个 HTTP 周期", "关掉 OSIV 后，一旦离开 Service 的 @Transactional 方法，Session 立即关闭归还连接", "配合 @BatchSize / @EntityGraph 在只读事务内把关联字段转成 UserVO Record 即可彻底避免懒加载异常"]
  },
  {
    num: "02", proj: "A", title: "TraceIdFilter、统一响应体与全局异常收口",
    foundation: "Servlet Filter 责任链 · ThreadLocal(MDC) 线程复用清理 (#18)",
    quiz: {
      q: "TraceIdFilter 往 MDC 放入 traceId 后，如果忘记在 finally 里调用 MDC.remove()，会发生什么？",
      opts: [

];

(function initApp() {
  const STORAGE_DONE = "java-hood-m7-done-v1";
  let doneSet = new Set();
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_DONE) || "[]");
    if (Array.isArray(raw)) doneSet = new Set(raw);
  } catch (e) {}

  let currentFilter = "ALL";
  let currentIdx = 0;
  let simProj = "A";
  let simScenIdx = 0;
  let timerId = null;
  let remainSec = 120;

  // Theme toggle
  document.getElementById("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("java-hood-lab-theme", next); } catch (e) {}
  });

  // Simulator
  function renderSim() {
    const cfg = SIM_DATA[simProj];
    document.getElementById("simModeA").className = simProj === "A" ? "primary" : "";
    document.getElementById("simModeB").className = simProj === "B" ? "primary" : "";

    const scenWrap = document.getElementById("simScenarios");
    scenWrap.innerHTML = "";
    cfg.scenarios.forEach((sc, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = sc.label;
      if (idx === simScenIdx) b.className = "active";
      b.onclick = () => { simScenIdx = idx; renderSim(); };
      scenWrap.appendChild(b);
    });

    const curScen = cfg.scenarios[simScenIdx];
    const pipeWrap = document.getElementById("simPipeline");
    pipeWrap.innerHTML = "";
    cfg.steps.forEach((st, i) => {
      const stState = curScen.states[i] || "pass";
      const div = document.createElement("div");
      div.className = "pipe-step " + stState;
      const badge = stState === "pass" ? "✅ 通过" : (stState === "block" ? "🛑 拦截/回滚" : "⏭️ 未到达");
      div.innerHTML = `<div class="step-num">STEP 0${i + 1} · ${badge}</div>
        <div class="step-name">${escapeHtml(st.name)}</div>
        <div class="step-tag">${escapeHtml(st.tag)}</div>`;
      pipeWrap.appendChild(div);
    });

    document.getElementById("simLog").textContent = curScen.explain;
  }

  document.getElementById("simModeA").onclick = () => { simProj = "A"; simScenIdx = 0; renderSim(); };
  document.getElementById("simModeB").onclick = () => { simProj = "B"; simScenIdx = 0; renderSim(); };

  // Filter tabs
  document.querySelectorAll(".filter-tabs button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".filter-tabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter");
      const firstMatch = LESSONS.findIndex(l => currentFilter === "ALL" || l.proj === currentFilter);
      if (firstMatch >= 0) currentIdx = firstMatch;
      renderSidebar();
      renderLesson();
    };
  });

  function updateProgressPill() {
    document.getElementById("progressText").textContent = `已吃透 ${doneSet.size} / ${LESSONS.length} 节`;
  }

  function renderSidebar() {
    updateProgressPill();
    const list = document.getElementById("lessonList");
    list.innerHTML = "";
    LESSONS.forEach((les, idx) => {
      if (currentFilter !== "ALL" && les.proj !== currentFilter) return;
      const row = document.createElement("div");
      row.className = "lesson-item" + (idx === currentIdx ? " active" : "");
      const isDone = doneSet.has(les.num);
      row.innerHTML = `<div style="display:flex;align-items:center;gap:0.45rem;">
          <span class="lesson-num">#${les.num}</span>
          <span>${escapeHtml(les.title)}</span>
        </div>
        <span class="done-dot">${isDone ? "✓" : ""}</span>`;
      row.onclick = () => {
        currentIdx = idx;
        stopTimer();
        renderSidebar();
        renderLesson();
      };
      list.appendChild(row);
    });
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    remainSec = 120;
  }

  function formatClock(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, "0");
    const s = String(sec % 60).padStart(2, "0");
    return `${m}:${s}`;
  }

  function renderLesson() {
    const les = LESSONS[currentIdx];
    const main = document.getElementById("lessonMain");
    const isDone = doneSet.has(les.num);

    main.innerHTML = `
      <div class="lesson-meta">
        <div>
          <span class="foundation-tag">项目 ${les.proj} · 第 ${les.num} 节 · 地基：${escapeHtml(les.foundation)}</span>
          <h2 class="lesson-title">${escapeHtml(les.title)}</h2>
        </div>
        <button id="toggleDoneBtn" class="${isDone ? "" : "primary"}" type="button">
          ${isDone ? "✓ 已标记吃透（点击取消）" : "标记本节已吃透"}
        </button>
      </div>

      <div class="section-block">
        <h3>① 先猜后看：地基直觉自测</h3>
        <p style="margin:0 0 0.7rem;font-weight:600;">${escapeHtml(les.quiz.q)}</p>
        <div id="quizOpts"></div>
        <div id="quizFeedback" class="quiz-feedback"></div>
      </div>

      <div class="section-block">
        <h3>② 正反代码对照：新手坏味道 vs 本仓生产级写法</h3>
        <div class="code-grid">
          <div class="code-pane bad">
            <div class="pane-label">❌ 新手易踩坑写法（一并发/异常就碎）</div>
            <pre>${escapeHtml(les.badCode)}</pre>
          </div>
          <div class="code-pane good">
            <div class="pane-label">✅ 本仓标准写法（零隐患兜底）</div>
            <pre>${escapeHtml(les.goodCode)}</pre>
          </div>
        </div>
      </div>

      <div class="section-block">
        <h3>③ 掀开机盖：底层到底发生了什么？</h3>
        <p style="margin:0;">${escapeHtml(les.hood)}</p>
      </div>

      <div class="section-block">
        <h3>④ IDE 动手破坏与断点任务（手熟心才稳）</h3>
        <div class="mission-box">${escapeHtml(les.mission)}</div>
      </div>

      <div class="section-block">
        <h3>⑤ 2 分钟脱稿开口检验（讲出来才算长在自己脑子里）</h3>
        <p style="margin:0 0 0.5rem;font-weight:600;">🎤 面试官提问：${escapeHtml(les.sayPrompt)}</p>
        <div class="timer-row">
          <span class="clock" id="clockDisplay">02:00</span>
          <button id="startTimerBtn" class="primary" type="button">开始 2 分钟计时口述</button>
          <button id="resetTimerBtn" type="button">重置</button>
          <button id="showPointsBtn" type="button">展开 / 收起满分得分点</button>
        </div>
        <ul id="sayPointsList" style="display:none;margin:0.75rem 0 0;padding-left:1.2rem;font-size:0.9rem;">
          ${les.sayPoints.map(pt => `<li>${escapeHtml(pt)}</li>`).join("")}
        </ul>
      </div>

      <div class="nav-footer">
        <button id="prevBtn" type="button" ${currentIdx === 0 ? "disabled" : ""}>← 上一节</button>
        <span style="font-size:0.85rem;color:var(--muted);">快捷键：← / → 切换课节</span>
        <button id="nextBtn" type="button" ${currentIdx === LESSONS.length - 1 ? "disabled" : ""}>下一节 →</button>
      </div>
    `;

    // Quiz bindings
    const optsWrap = document.getElementById("quizOpts");
    const fb = document.getElementById("quizFeedback");
    les.quiz.opts.forEach((optText, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "quiz-opt";
      btn.textContent = `${String.fromCharCode(65 + idx)}. ${optText}`;
      btn.onclick = () => {
        optsWrap.querySelectorAll("button").forEach(b => b.classList.remove("correct", "wrong"));
        const ok = idx === les.quiz.ans;
        btn.classList.add(ok ? "correct" : "wrong");
        if (!ok) optsWrap.querySelectorAll("button")[les.quiz.ans].classList.add("correct");
        fb.style.display = "block";
        fb.style.background = ok ? "var(--ok-wash)" : "var(--accent-wash)";
        fb.textContent = (ok ? "回答正确！ " : "再想想看：") + les.quiz.why;
      };
      optsWrap.appendChild(btn);
    });

    // Done toggle
    document.getElementById("toggleDoneBtn").onclick = () => {
      if (doneSet.has(les.num)) doneSet.delete(les.num);
      else doneSet.add(les.num);
      try { localStorage.setItem(STORAGE_DONE, JSON.stringify([...doneSet])); } catch (e) {}
      renderSidebar();
      renderLesson();
    };

    // Timer bindings
    const clockEl = document.getElementById("clockDisplay");
    const startBtn = document.getElementById("startTimerBtn");
    startBtn.onclick = () => {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        startBtn.textContent = "继续计时";
        return;
      }
      startBtn.textContent = "暂停计时";
      timerId = setInterval(() => {
        if (remainSec > 0) {
          remainSec--;
          clockEl.textContent = formatClock(remainSec);
        } else {
          clearInterval(timerId);
          timerId = null;
          startBtn.textContent = "时间到！核对下方得分点";
          document.getElementById("sayPointsList").style.display = "block";
        }
      }, 1000);
    };
    document.getElementById("resetTimerBtn").onclick = () => {
      stopTimer();
      clockEl.textContent = "02:00";
      startBtn.textContent = "开始 2 分钟计时口述";
    };
    document.getElementById("showPointsBtn").onclick = () => {
      const ul = document.getElementById("sayPointsList");
      ul.style.display = ul.style.display === "none" ? "block" : "none";
    };

    document.getElementById("prevBtn").onclick = () => {
      if (currentIdx > 0) { currentIdx--; stopTimer(); renderSidebar(); renderLesson(); }
    };
    document.getElementById("nextBtn").onclick = () => {
      if (currentIdx < LESSONS.length - 1) { currentIdx++; stopTimer(); renderSidebar(); renderLesson(); }
    };
  }

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft" && currentIdx > 0) {
      currentIdx--; stopTimer(); renderSidebar(); renderLesson();
    } else if (e.key === "ArrowRight" && currentIdx < LESSONS.length - 1) {
      currentIdx++; stopTimer(); renderSidebar(); renderLesson();
    }
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  renderSim();
  renderSidebar();
  renderLesson();
})();
</script>
</body>
</html>
